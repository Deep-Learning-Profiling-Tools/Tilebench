# Frozen study configuration of the TileBench++ LLM protocol (revision 2).
# Loaded and validated by tilebench.llm.v2.manifests.schema.load_study().
# Changing any value here changes the campaign config hash; trajectories
# produced under another hash are refused by the runner.
protocol: tilebench-llm-v2
revision: 2

trajectory:
  rounds: 10                      # fixed; no performance-triggered early stop
  max_generations_per_round: 3    # initial generation + at most 2 compliance repairs
  repair_only_on: [confirmed_contract_violation, confirmed_reward_hacking]
  history_rule: >
    The refinement prompt carries (a) the previous round's candidate and its
    outcome, (b) this trajectory's best valid candidate when one exists and
    differs from (a), and (c) the raw runtime history of every valid round.
    Nothing from any other task, DSL, model, device, dtype or condition.
  regression_rule: >
    A valid candidate slower than the best valid one is recorded as the round's
    result; the best valid candidate is never replaced by a slower one.
  context_overflow_rule: >
    If a rendered prompt exceeds total_max_chars the attempt fails with
    status=prompt_too_long before any API call; nothing is truncated or
    compressed per model.

timing:
  warmup: 1
  repeat: 3
  statistic: arithmetic_mean_of_3
  cache_flush: operator_boundary_outside_timed_scope
  cuda_graph_requested: true      # NVIDIA replays a graph; ROCm times eagerly
  record_prep_runs: true          # graph-capture/warm runs are counted and reported
  # Versioned policy for a failed CUDA-graph capture on a device whose adapter
  # requests graph replay: the candidate is timed eagerly, the timing record
  # states capture_succeeded=false / timing_execution_mode=eager, and metrics
  # and exports flag the round (timing_mode_differs) instead of comparing it
  # silently with graph-timed rounds. Changing the policy changes the config
  # hash. (The worker reads the normalized keys produced by
  # evaluation.job.timing_settings; these names are the study's, not the
  # worker's.)
  capture_failure_policy: time_eagerly_and_flag          # validation runs
  # Formal runs (owner, FINAL_FREEZE_AND_START_B200.md §5, 2026-10-06): on a device whose adapter replays a
  # CUDA graph, a failed capture is a timing_error that consumes the round; the candidate is never timed
  # eagerly as a valid formal sample.
  capture_failure_policy_formal: timing_error
  measured_quantity: >
    GPU time of every kernel launched inside run() (Proton device time,
    summed per launch). Host-side work inside run() (allocation calls,
    metadata, Python) is not GPU time and is not counted; any extra kernel,
    copy, fill or cast launched by run() is.

# Per-candidate evaluation wall-clock limit (worker timeout), frozen for the
# formal campaigns (owner, 2026-10-06): identical for every model and DSL;
# formal runs refuse any other value; part of the evaluator fingerprint.
evaluation:
  worker_timeout_s: 1800

# Device Context snapshot a campaign injects per device (manifest version key).
device_snapshots:
  B200: "2026-10-06"

# Run types. Both use the identical execution chain; only gating and the
# downstream use of the results differ.
run_types:
  formal:
    description: scored Base/Enhanced campaign; results enter E(B) curves and distillation
    requires: [approved_contracts, approved_or_frozen_skills, approved_models, frozen_folds_for_enhanced]
  validation:
    description: >
      engineering acceptance of the execution chain with real models on real
      devices; unscored; never a distillation source; never mixed into formal
      curves; draft contracts and draft skills are accepted and recorded
    requires: [existing_contracts, draft_or_better_skills, candidate_or_approved_models, provider_sendable_assets]

conditions:
  base: [reference_skill, device_context_skill, algorithm_contract]
  enhanced: [reference_skill, device_context_skill, algorithm_contract, optimization_skill]

support_matrix:
  B200:   {arch: blackwell, dsls: [triton, cutile, tilelang], timing_adapter: proton_cuda_graph}
  GH200:  {arch: hopper,    dsls: [triton, cutile, tilelang], timing_adapter: proton_cuda_graph}
  MI300X: {arch: cdna3,     dsls: [triton],                   timing_adapter: proton_rocm_eager}
  Trn2:   {arch: trainium2, dsls: [nki],                      timing_adapter: neuron_runtime_trace}

dsls:
  triton:   {output_file: impl_triton.py,   reference_version: "3.6.0",  source_device: B200}
  cutile:   {output_file: impl_cutile.py,   reference_version: "1.5.0",  source_device: B200}
  tilelang: {output_file: impl_tilelang.py, reference_version: "0.1.11", source_device: B200}
  nki:      {output_file: impl_nki.py,      reference_version: "beta5",  source_device: Trn2}

# Devices that receive a DSL's frozen Optimization Skills (same text/hash).
skill_transfer:
  triton:   [B200, GH200, MI300X]
  cutile:   [B200, GH200]
  tilelang: [B200, GH200]
  nki:      [Trn2]

folds: [A, B, C]

context_limits:            # characters of injected text; exceeding is an error
  reference_skill: 120000
  device_context_skill: 30000
  algorithm_contract: 20000
  optimization_skill: 40000
  functional_reference: 20000
  total_prompt: 260000

feedback:
  performance_fields: [latency_ms_mean, latency_ms_samples]
  forbidden_fields: [t_sol, t_emp, p_emp, bw_emp, calibration_id, ceiling_basis, sol_efficiency, roofline,
                     stop_score, speedup, human_ms, torch_ms, pct_peak, profiler_counters, score]
  max_diagnostic_lines: 60
  max_diagnostic_chars: 6000

case_selection:
  rule: >
    Among the operator's expanded cases with the task dtype, pick the one with
    the largest infer_problem_size(); ties keep the last case in grid order.
    Parameters are taken from that single case, never combined across cases.
