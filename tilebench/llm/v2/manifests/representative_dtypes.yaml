# One representative dtype per operator (protocol revision 3).
# GENERATED by tilebench.llm.v2.tasks.representative.build_manifest(); validated on every load against the
# operator configs (validate_manifest). Deterministic and predeclared: no latency, SOL, human-kernel or LLM
# success information is an input. Do not edit by hand.
schema: tilebench-llm-representative-dtypes/1
status: frozen
frozen_on: '2026-10-06'
approved_by: "study owner, protocol revision 3 instruction (2026-10-06) \xA71: one predeclared representative dtype per operator, identical across\
  \ DSLs, models, conditions and devices"
rules:
  A: 'general floating-point operator: fp16 if eligible, else bf16, else fp32, else the remaining floating dtype'
  B: 'integer-semantics operator: the natural integer dtype required by the contract/reference'
  C: 'int8-specific / quantized-int8 operator: int8'
  D: 'exactly one eligible dtype: that dtype'
rule_order:
- C
- B
- D
- A
case_rule: largest infer_problem_size() among the selected dtype's expanded cases; ties keep the last case
inputs_excluded:
- latency
- SOL/T_emp
- human kernel performance
- LLM success rate
cross_device: transfer devices use the same selected dtype; an operator whose selected dtype a target device does not support is excluded from
  paired cross-device coverage, never re-typed
