verify:
  atol: 1e-4
  rtol: 1e-4

benchmark:
  warmup: 20
  repeat: 100
  use_cuda_graph: true
  flush_l2: true
  autotune: false

case_grid:
  rows: [512, 1024, 2048, 4096]
  cols: [1024, 2048, 4096, 8192, 16384]

metrics:
  bytes_expr: "rows * cols * 4 * 2 + rows * 4"
  flops_expr: "4 * rows * cols"

  plots:
    - latency_ms
    - bandwidth_GBs
    - speedup
