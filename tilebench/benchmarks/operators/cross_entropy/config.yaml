verify:
  atol: 1e-3
  rtol: 1e-3

benchmark:
  warmup: 20
  repeat: 100
  use_cuda_graph: true
  flush_l2: true
  autotune: false

case_defaults:
  num_classes: 512

case_grid:
  batch_size:
    expr: "[512 * i for i in range(1, 21)]"
  dtype: ["fp16", "fp32"]

metrics:
  bytes_expr: "batch_size * num_classes * dtype_size + batch_size * 8 + batch_size * dtype_size"
  flops_expr: "batch_size * num_classes * 4"

  plots:
    - latency_ms
    - bandwidth_GBs
    - speedup
