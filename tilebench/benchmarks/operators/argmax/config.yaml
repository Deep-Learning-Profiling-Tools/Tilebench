benchmark:
  warmup: 20
  repeat: 100
  use_cuda_graph: true
  flush_l2: true
  autotune: false

case_defaults:
  M: 2048

case_grid:
  N:
    expr: "[1024 * i for i in range(1, 21)]"
  dtype: ["fp16", "fp32"]

metrics:
  flops_expr: "M * N"
  bytes_expr: "M * N * dtype_size"

  plots:
    - latency_ms
    - bandwidth_GBs
    - speedup
