verify:
  atol: 1.0
  rtol: 1.0e-2

benchmark:
  warmup: 20
  repeat: 100
  use_cuda_graph: true
  flush_l2: true
  autotune: false

case_defaults:
  BATCH: 32

case_grid:
  M:
    expr: "[32 * i for i in range(1, 21)]"
  dtype: ["fp16", "bf16", "fp32"]

metrics:
  flops_expr: "2 * BATCH * M * M * M"
  bytes_expr: "3 * BATCH * M * M * dtype_size"

  plots:
    - latency_ms
    - tflops
    - speedup
