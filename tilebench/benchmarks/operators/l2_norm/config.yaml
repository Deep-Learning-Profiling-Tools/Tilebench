benchmark:
  warmup: 20
  repeat: 100
  use_cuda_graph: true
  flush_l2: true
  autotune: false

case_defaults:
  batch: 1
  M: 2048
  eps: 1.0e-6

case_grid:
  K:
    expr: "[512 * i for i in range(1, 21)]"
  dtype: ["fp16", "bf16", "fp32"]

metrics:
  flops_expr: "3 * batch * M * K"
  bytes_expr: "2 * batch * M * K * dtype_size"

  plots:
    - latency_ms
    - bandwidth_GBs
