benchmark:
  warmup: 20
  repeat: 100
  use_cuda_graph: true
  flush_l2: true
  autotune: false

case_grid:
  N:
    expr: "[256 * i for i in range(1, 21)]"
  dtype: ["fp16", "bf16", "fp32", "int8"]

metrics:
  flops_expr: "N * N"
  bytes_expr: "N * N * dtype_size * 2"

  plots:
    - latency_ms
    - bandwidth_GBs
    - speedup
