# exp/mi300x: atol 0.1 -> 0.2. The numerical behavior of the ROCm/MIOpen fp16
# conv2d reference deviates from a strict-fp32 reference enough to exceed 0.1
# (largest atol the Triton-vs-reference check needs at rtol 0.01: 0.173 over
# 100 inputs each of H=16/176/320), while Triton stays within 0.063 of fp32.
# One operator-level tolerance, so it also applies to fp32 verification.
verify:
  atol: 2e-1
  rtol: 1e-2

benchmark:
  warmup: 20
  repeat: 100
  use_cuda_graph: true
  flush_l2: true
  autotune: false

case_defaults:
  batch: 1
  in_channels: 128
  out_channels: 128
  kernel_size: 3
  stride: 1
  padding: 1
  groups: 1

case_grid:
  H:
    expr: "[16 * i for i in range(1, 21)]"
  dtype: ["fp16", "fp32"]

metrics:
  flops_expr: >
    2 * batch * out_channels
    * ((H + 2 * padding - kernel_size) // stride + 1) ** 2
    * (in_channels // groups) * kernel_size ** 2

  bytes_expr: >
    batch * in_channels * H * H * dtype_size
    + out_channels * (in_channels // groups) * kernel_size ** 2 * dtype_size
    + batch * out_channels * ((H + 2 * padding - kernel_size) // stride + 1) ** 2 * dtype_size

  plots:
    - latency_ms
    - tflops
    - speedup
