benchmark:
  warmup: 20
  repeat: 100
  use_cuda_graph: true
  flush_l2: true
  autotune: false

case_defaults:
  n_rows: 2048

case_grid:
  n_cols: [10240]
  dtype: ["fp16", "fp32"]

metrics:
  flops_expr: "n_rows * n_cols"
  bytes_expr: "n_rows * n_cols * dtype_size * 2"
  plots:
    - latency_ms
    - bandwidth_GBs
    - speedup
