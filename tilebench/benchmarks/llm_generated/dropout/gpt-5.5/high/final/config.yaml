benchmark:
  warmup: 20
  repeat: 100
  use_cuda_graph: true
  flush_l2: true
  autotune: false

case_defaults:
  p: 0.5

case_grid:
  # 1M to 20M elements, step 1M
  n: [20971520]
  dtype: ["fp16", "bf16", "fp32"]
  # int8 excluded: x / (1-p) is undefined for integer types

# ---------------------------------------------------------------------------
# Derived-metric expressions
#   Available variables: n (problem size), dtype_size (bytes per element)
# ---------------------------------------------------------------------------
metrics:
  flops_expr: "n"
  # x read + x_keep read (same dtype) + output write
  bytes_expr: "n * dtype_size * 3"

  plots:
    - latency_ms
    - bandwidth_GBs
    - speedup
