benchmark:
  warmup: 20
  repeat: 100
  use_cuda_graph: true
  flush_l2: true
  autotune: false

case_defaults:
  m: 4096   # rows (fixed)

case_grid:
  # n: columns, 1024 to 20480 in 20 steps; total elements m*n = 4M to 80M
  n: [20480]
  dtype: ["fp16", "bf16", "fp32", "int8"]

# ---------------------------------------------------------------------------
# Derived-metric expressions
#   Available variables: n (problem size = m*n), dtype_size (bytes per element)
# ---------------------------------------------------------------------------
metrics:
  flops_expr: "0"
  # 1 read + 1 write
  bytes_expr: "m * n * dtype_size * 2"

  plots:
    - latency_ms
    - bandwidth_GBs
    - speedup
