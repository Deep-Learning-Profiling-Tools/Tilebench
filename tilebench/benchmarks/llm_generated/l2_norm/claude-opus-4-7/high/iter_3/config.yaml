# L2 normalization: y = x / ||x||_2  (per-row)
# One CTA per row; no weight or bias.

benchmark:
  warmup: 20
  repeat: 100
  use_cuda_graph: true
  flush_l2: true
  autotune: false

case_defaults:
  batch: 1
  M: 2048
  eps: 1.0e-6

case_grid:
  K: [10240] # 512, 1024, ..., 10240 (20 points)
  dtype: ["fp16", "bf16", "fp32"]

# ---------------------------------------------------------------------------
# Metrics
#   FLOPs: K muls (x²) + K adds (sum) + K muls (x * rstd) ≈ 3K per row
#   Bytes: read x + write y = 2 * rows * K * dtype_size
# ---------------------------------------------------------------------------
metrics:
  flops_expr: "3 * batch * M * K"
  bytes_expr: "2 * batch * M * K * dtype_size"

  plots:
    - latency_ms
    - bandwidth_GBs
