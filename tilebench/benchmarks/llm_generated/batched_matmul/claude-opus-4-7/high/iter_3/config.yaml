# Batched Matrix Multiplication — tiled GEMM with K-dim accumulation via tl.dot / ct.mma.
# Loose verify tolerances because fp16/bf16/TF32 MMA accumulation produces ~1e-2 relative error.

verify:
  atol: 1.0
  rtol: 1.0e-2

benchmark:
  warmup: 20
  repeat: 100
  use_cuda_graph: true
  flush_l2: true
  autotune: false

# Fix BATCH=32, square M=N=K matrices; sweep the inner dim to cover
# small (cache-resident) to large (HBM-bound) regimes.
# Max: BATCH=32, M=N=K=512, fp32 → 32 * 512*512 * 4 * 2 (A+B) = 64 MB, above L2 (50 MB).
case_defaults:
  BATCH: 32

case_grid:
  M: [640] # 32, 64, ..., 640 (20 points; also used for N and K)
  dtype: ["fp16", "bf16", "fp32"]

# N and K default to M in the generator (square matmul for the sweep).

# ---------------------------------------------------------------------------
# Derived-metric expressions (N = K = M, square matmul)
#   FLOPs: 2 * BATCH * M * N * K  (standard matmul count)
#   Bytes:
#     Read A:      BATCH * M * K * dtype_size
#     Read B:      BATCH * K * N * dtype_size
#     Write C:     BATCH * M * N * dtype_size
# ---------------------------------------------------------------------------
metrics:
  flops_expr: "2 * BATCH * M * M * M"
  bytes_expr: "3 * BATCH * M * M * dtype_size"

  plots:
    - latency_ms
    - tflops
    - speedup
