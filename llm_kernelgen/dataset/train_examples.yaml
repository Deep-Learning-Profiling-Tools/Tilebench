# Training examples: operators whose implementations MAY appear as few-shot
# demonstrations inside LLM prompts.
#
# Each entry can optionally specify which example file (relative to
# prompts/examples/) maps to that operator for each backend.

operators:
  vector_add:
    triton_example: triton_elementwise.md
    cutile_example: cutile_elementwise.md
    description: "Simple element-wise addition; demonstrates masking pattern."

  relu:
    triton_example: triton_fused_ops.md
    cutile_example: cutile_elementwise.md
    description: "Element-wise ReLU activation; demonstrates tl.where / ct.where."

  mean_reduction:
    triton_example: triton_reduction.md
    cutile_example: cutile_reduction.md
    description: "Row-wise mean; demonstrates reduction accumulator pattern."

  matrix_transpose:
    triton_example: triton_tiled_matmul.md
    cutile_example: cutile_matmul.md
    description: "2-D transpose; demonstrates 2-D block grid launch."
