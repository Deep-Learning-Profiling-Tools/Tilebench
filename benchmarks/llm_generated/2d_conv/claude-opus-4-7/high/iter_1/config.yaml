# Conv2d forward pass: implicit GEMM via im2col.
# Conv is K*K*C_in multiply-adds per output element (1152 for 3x3 + C_in=128),
# so accumulation order + TF32 tensor-core paths inflate error beyond per-dtype
# defaults. Override with loose atol/rtol to match the GEMM convention.
verify:
  atol: 1e-1
  rtol: 1e-2

benchmark:
  warmup: 20
  repeat: 100
  use_cuda_graph: true
  flush_l2: true
  autotune: false

# Sweep spatial dimension H (= W) across 20 points with other dims fixed.
# out_H = out_W = (H + 2*padding - kernel_size) // stride + 1
#               = H  (for padding=1, kernel_size=3, stride=1)
case_defaults:
  batch: 1
  in_channels: 128
  out_channels: 128
  kernel_size: 3
  stride: 1
  padding: 1
  groups: 1

case_grid:
  H: [320] # 16, 32, ..., 320 (20 points)
  dtype: ["fp16", "fp32"]

# ---------------------------------------------------------------------------
# Derived-metric expressions
#   out_H = out_W = (H + 2*padding - kernel_size) // stride + 1
#
# FLOPs: 2 * batch * out_channels * out_H * out_W * (in_channels // groups) * kernel_size^2
# Bytes:
#   Read  input:  batch * in_channels * H * H * dtype_size
#   Read  weight: out_channels * (in_channels // groups) * kernel_size^2 * dtype_size
#   Write output: batch * out_channels * out_H * out_W * dtype_size
# ---------------------------------------------------------------------------
metrics:
  flops_expr: >
    2 * batch * out_channels
    * ((H + 2 * padding - kernel_size) // stride + 1) ** 2
    * (in_channels // groups) * kernel_size ** 2

  bytes_expr: >
    batch * in_channels * H * H * dtype_size
    + out_channels * (in_channels // groups) * kernel_size ** 2 * dtype_size
    + batch * out_channels * ((H + 2 * padding - kernel_size) // stride + 1) ** 2 * dtype_size

  plots:
    - latency_ms
    - tflops
    - speedup
