# Matrix copy: B = A for an N x N matrix
# Pure memory-bound operation — no computation, exact copy.

benchmark:
  warmup: 20
  repeat: 100
  use_cuda_graph: true
  flush_l2: true
  autotune: false

case_grid:
  N: [5120] # 256, 512, ..., 5120 (20 points)
  dtype: ["fp16", "bf16", "fp32", "int8"]

# Derived-metric expressions
#   matrix_copy is pure memory-bound: no meaningful FLOPs
metrics:
  # Use element count as proxy (no real compute)
  flops_expr: "N * N"
  # 1 read + 1 write per element
  bytes_expr: "N * N * dtype_size * 2"

  plots:
    - latency_ms
    - bandwidth_GBs
    - speedup
