# 1D Convolution with valid padding (no padding)
# Using loose tolerances because cuTile GEMM with TF32 causes numerical differences.
verify:
  atol: 0.1
  rtol: 1e-2

benchmark:
  warmup: 20
  repeat: 100
  use_cuda_graph: true
  flush_l2: true
  autotune: false

# Sweep input_size across 20 points with kernel_size fixed.
# output_size = input_size - kernel_size + 1
case_defaults:
  kernel_size: 127

case_grid:
  input_size: [20000000] # 1M, 2M, ..., 20M (20 points)
  dtype: ["fp16", "fp32"]

# ---------------------------------------------------------------------------
# Derived-metric expressions
#   output_size = input_size - kernel_size + 1
#
# FLOPs: 2 * output_size * kernel_size
# Bytes:
#   Read  input:  input_size * dtype_size
#   Read  kernel: kernel_size * dtype_size
#   Write output: output_size * dtype_size
# ---------------------------------------------------------------------------
metrics:
  flops_expr: >
    2 * (input_size - kernel_size + 1) * kernel_size

  bytes_expr: >
    input_size * dtype_size
    + kernel_size * dtype_size
    + (input_size - kernel_size + 1) * dtype_size

  plots:
    - latency_ms
    - tflops
    - speedup
