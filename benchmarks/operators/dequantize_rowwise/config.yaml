verify:
  # Loose tolerance: state_x * (1/127) introduces small fp32 rounding;
  # output magnitude in [-state_x, state_x] ~ O(1).
  atol: 1e-3
  rtol: 1e-3

benchmark:
  warmup: 20
  repeat: 100
  use_cuda_graph: true
  flush_l2: true
  autotune: false

case_grid:
  rows: [512, 1024, 2048, 4096]
  cols: [512, 1024, 2048, 4096, 8192]

# ---------------------------------------------------------------------------
# Derived-metric expressions
#   Available variables: rows, cols
#
# Bytes:
#   Read  x       (int8): rows * cols * 1
#   Read  state_x (fp32): rows * 4
#   Write out    (fp16):  rows * cols * 2
#
# FLOPs: 2 * rows * cols  (one mul by scale, one mul by inv_127 = two FMAs)
# ---------------------------------------------------------------------------
metrics:
  bytes_expr: "rows * cols * 1 + rows * 4 + rows * cols * 2"
  flops_expr: "2 * rows * cols"

  plots:
    - latency_ms
    - bandwidth_GBs
    - speedup
