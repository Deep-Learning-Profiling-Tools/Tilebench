verify:
  atol: 0.1
  rtol: 1e-2

benchmark:
  warmup: 20
  repeat: 100
  use_cuda_graph: true
  flush_l2: true
  autotune: false

case_defaults:
  kernel_rows: 7
  kernel_cols: 7

case_grid:
  input_rows:
    expr: "[512 * i for i in range(1, 21)]"
  dtype: ["fp16", "fp32"]

metrics:
  flops_expr: >
    2 * input_rows * input_rows * kernel_rows * kernel_cols

  bytes_expr: >
    input_rows * input_rows * dtype_size
    + kernel_rows * kernel_cols * dtype_size
    + input_rows * input_rows * dtype_size

  plots:
    - latency_ms
    - tflops
    - speedup
