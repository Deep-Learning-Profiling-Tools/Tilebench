benchmark:
  warmup: 20
  repeat: 100
  use_cuda_graph: true
  flush_l2: true
  autotune: false

case_defaults:
  BLOCK_SIZE: 1024

test_cases:
  - {N: 1024, k: 16, dtype: "float32"}
  - {N: 4096, k: 32, dtype: "float32"}
  - {N: 16384, k: 64, dtype: "float32"}
  - {N: 65536, k: 128, dtype: "float32"}

verify:
  atol: 1.0e-5
  rtol: 1.0e-5

metrics:
  flops_expr: "N"
  bytes_expr: "(N + k) * dtype_size"
  peak_bw_GBs: 8000.0
  peak_tflops:
    float32: 125.0
  plots:
    - latency_ms
    - bandwidth_GBs
    - speedup