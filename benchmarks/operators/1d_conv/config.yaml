# Conv1d forward pass: multi-channel implicit GEMM (1D analog of 2d_conv).
# Conv is C_in*kL multiply-adds per output element (384 for k=3 + C_in=128), so
# accumulation order + TF32 tensor-core paths inflate error beyond per-dtype
# defaults. Override with loose atol/rtol to match the GEMM convention.
verify:
  atol: 1e-1
  rtol: 1e-2

benchmark:
  warmup: 20
  repeat: 100
  use_cuda_graph: true
  flush_l2: true
  autotune: false

# Sweep sequence length L with channel dims fixed.
# out_L = (L + 2*padding - kernel_size) // stride + 1 = L  (padding=1, k=3, s=1)
case_defaults:
  batch: 1
  in_channels: 128
  out_channels: 128
  kernel_size: 3
  stride: 1
  padding: 1
  groups: 1

case_grid:
  L:
    expr: "[131072 * i for i in range(1, 21)]"   # 128K ... 2.62M (20 points)
  dtype: ["fp16", "fp32"]

# ---------------------------------------------------------------------------
# Derived-metric expressions
#   out_L = (L + 2*padding - kernel_size) // stride + 1
#
# FLOPs: 2 * batch * out_channels * out_L * (in_channels // groups) * kernel_size
# Bytes:
#   Read  input:  batch * in_channels * L * dtype_size
#   Read  weight: out_channels * (in_channels // groups) * kernel_size * dtype_size
#   Write output: batch * out_channels * out_L * dtype_size
# ---------------------------------------------------------------------------
metrics:
  flops_expr: >
    2 * batch * out_channels
    * ((L + 2 * padding - kernel_size) // stride + 1)
    * (in_channels // groups) * kernel_size

  bytes_expr: >
    batch * in_channels * L * dtype_size
    + out_channels * (in_channels // groups) * kernel_size * dtype_size
    + batch * out_channels * ((L + 2 * padding - kernel_size) // stride + 1) * dtype_size

  plots:
    - latency_ms
    - tflops
    - speedup
