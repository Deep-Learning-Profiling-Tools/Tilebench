benchmark:
  warmup: 20
  repeat: 100
  use_cuda_graph: true
  flush_l2: true
  autotune: false

case_grid:
  # 1M to 20M elements, step 1M
  n:
    expr: "[1024 * 1024 * i for i in range(1, 21)]"
  dtype: ["fp16", "bf16", "fp32"]

case_defaults:
  eps: 1.0e-5

# ---------------------------------------------------------------------------
# Derived-metric expressions
#   Available variables: n (problem size), dtype_size (bytes per element)
#
# FLOPs per element: clamp(2) + log(2) + sub + mul = ~5 ops
# Bytes:
#   Read  p (input dtype): n * dtype_size
#   Read  q (input dtype): n * dtype_size
#   Write output (fp32):   n * 4
# ---------------------------------------------------------------------------
metrics:
  flops_expr: "n * 5"
  bytes_expr: "n * dtype_size * 2 + n * 4"

  plots:
    - latency_ms
    - bandwidth_GBs
    - speedup
