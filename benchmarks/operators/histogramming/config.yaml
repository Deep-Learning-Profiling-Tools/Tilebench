benchmark:
  warmup: 20
  repeat: 100
  use_cuda_graph: true
  flush_l2: true
  autotune: false

case_defaults:
  BLOCK_SIZE: 1024
  NUM_PARTIAL: 256
  BLOCK_ROWS: 64
  BLOCK_BINS: 256

case_grid:
  N: [1048576, 4194304, 16777216]
  num_bins: [64, 256, 1024]
  dtype: ["int32"]

verify:
  atol: 0
  rtol: 0

metrics:
  flops_expr: "N"
  bytes_expr: "(N + num_bins + NUM_PARTIAL * num_bins) * dtype_size"
  peak_bw_GBs: 8000.0
  peak_tflops:
    int32: 60.0
  plots:
    - latency_ms
    - bandwidth_GBs
    - speedup