benchmark:
  warmup: 20
  repeat: 100
  use_cuda_graph: true
  flush_l2: true
  autotune: false

case_defaults:
  M: 4096   # number of tokens (fixed)

case_grid:
  # N: hidden dim, 1024 to 8192 in 8 steps; total elements M*N = 4M to 32M
  N:
    expr: "[1024 * i for i in range(1, 9)]"
  dtype: ["fp16", "bf16", "fp32"]
  # int8 excluded: sigmoid(int8) is undefined

# ---------------------------------------------------------------------------
# Derived-metric expressions
#   Available variables: n (problem size = M*N), dtype_size (bytes per element)
# ---------------------------------------------------------------------------
metrics:
  flops_expr: "n"
  # x read + y read + output write
  bytes_expr: "n * dtype_size * 3"

  # B200 peak HBM3e bandwidth (GB/s)
  peak_bw_GBs: 8000.0

  peak_tflops:
    fp16: 400.0
    bf16: 400.0
    fp32: 80.0

  plots:
    - latency_ms
    - bandwidth_GBs
    - speedup
    - pct_peak_bw
    - roofline
