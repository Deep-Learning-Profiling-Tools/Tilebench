benchmark:
  warmup: 20
  repeat: 100
  use_cuda_graph: true
  flush_l2: true          # scatter write, memory-bound
  autotune: false

# Fixed head configuration (MLA-typical). Only seq_len and dtype are swept.
# n = infer_problem_size = total_tokens * (nope_heads*nope_dim + rope_heads*rope_dim)
#                        = seq_len * (12*128 + 1*64) = seq_len * 1600
case_defaults:
  batch_size: 1
  kv_nope_head_num: 12
  kv_rope_head_num: 1
  kv_nope_head_dim: 128
  kv_rope_head_dim: 64

case_grid:
  seq_len:
    expr: "[2048 * i for i in range(1, 21)]" # 2K-40K
  dtype: ["fp16", "bf16", "fp32", "int8"]

metrics:
  # Pure scatter copy: 1 read (kv) + 1 write (out) per element.
  flops_expr: "n"
  bytes_expr: "n * dtype_size * 2"

  plots:
    - latency_ms
    - bandwidth_GBs
    - speedup
