benchmark:
  warmup: 20
  repeat: 100
  use_cuda_graph: true
  flush_l2: true
  autotune: false

case_defaults:
  n_rows: 2048

case_grid:
  n_cols:
    expr: "[512 * i for i in range(1, 21)]"
  dtype: ["float32", "float16"]

metrics:
  flops_expr: "n_rows * n_cols"
  bytes_expr: "n_rows * n_cols * dtype_size * 2"
  plots:
    - latency_ms
    - bandwidth_GBs
    - speedup
