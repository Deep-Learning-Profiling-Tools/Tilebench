benchmark:
  warmup: 20
  repeat: 100
  use_cuda_graph: true
  flush_l2: true
  autotune: false

case_defaults:
  batch: 2
  heads: 8
  head_dim: 128
  block_seq: 128

case_grid:
  seq_len:
    expr: "[2048 * i for i in range(1, 21)]"
  dtype: ["float32"]

metrics:
  flops_expr: "batch * heads * seq_len * head_dim"
  bytes_expr: "batch * heads * seq_len * head_dim * dtype_size * 2"
  plots:
    - latency_ms
    - bandwidth_GBs
    - speedup
