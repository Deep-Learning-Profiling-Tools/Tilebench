benchmark:
  warmup: 20
  repeat: 100
  use_cuda_graph: true
  flush_l2: true
  autotune: false

case_grid:
  # 1M to 20M elements, step 1M
  n:
    expr: "[1024 * 1024 * i for i in range(1, 21)]"
  dtype: ["fp16", "bf16", "fp32"]

# ---------------------------------------------------------------------------
# Derived-metric expressions
#   Available variables: n (problem size), dtype_size (bytes per element)
#
# FLOPs per element: mul + add + relu = 3 ops
# Bytes:
#   Read  x, gate, bias (input dtype): n * dtype_size * 3
#   Write output (fp32):               n * 4
# ---------------------------------------------------------------------------
metrics:
  flops_expr: "n * 3"
  bytes_expr: "n * dtype_size * 3 + n * 4"

  plots:
    - latency_ms
    - bandwidth_GBs
    - speedup
