benchmark:
  warmup: 20
  repeat: 100
  use_cuda_graph: true
  flush_l2: true
  autotune: false

case_defaults:
  batch_size: 4
  n_heads: 32
  head_dim: 64
  causal: true

case_grid:
  seq_len:
    expr: "[1024 * i for i in range(1, 21)]"
  dtype: ["float16"]

metrics:
  flops_expr: "2 * batch_size * n_heads * seq_len * seq_len * head_dim"
  bytes_expr: "batch_size * n_heads * seq_len * head_dim * dtype_size * 3"
  peak_bw_GBs: 8000.0
  peak_tflops:
    float16: 400.0
  plots:
    - latency_ms
    - bandwidth_GBs
    - speedup