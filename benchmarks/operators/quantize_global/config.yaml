benchmark:
  warmup: 20
  repeat: 100
  use_cuda_graph: true
  flush_l2: true
  autotune: false

case_defaults:
  dtype: "fp32"

case_grid:
  n:
    expr: "[1024 * 1024 * i for i in range(1, 21)]"

metrics:
  flops_expr: "n"
  bytes_expr: "n * dtype_size + n * 2"

  plots:
    - latency_ms
    - bandwidth_GBs
    - speedup
