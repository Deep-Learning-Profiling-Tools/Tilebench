benchmark:
  warmup: 20
  repeat: 100
  use_cuda_graph: true
  flush_l2: true
  autotune: false

case_defaults:
  B: 2
  H: 8
  H_kv: 2
  BLOCK_M: 64
  BLOCK_N: 64
  BLOCK_D: 64

case_grid:
  M:
    expr: "[512 * i for i in range(1, 5)]"
  D: [64, 128]
  dtype: ["float16"]

# Loose tolerance for float16 (this operator has known accumulation differences)
verify:
  atol: 5e-2
  rtol: 5e-3

metrics:
  flops_expr: "2 * B * H * M * M * D"
  bytes_expr: "B * H * M * D * dtype_size * 4"
  plots:
    - latency_ms
    - bandwidth_GBs
    - speedup
