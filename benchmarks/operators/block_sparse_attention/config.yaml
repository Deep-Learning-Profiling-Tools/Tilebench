benchmark:
  warmup: 20
  repeat: 100
  use_cuda_graph: true
  flush_l2: true
  autotune: false

case_defaults:
  B: 2
  H: 8
  H_kv: 2
  BLOCK_M: 64
  BLOCK_N: 64
  BLOCK_D: 128
  D: 128

case_grid:
  M:
    expr: "[512 * i for i in range(1, 21)]"
  dtype: ["fp16"]

verify:
  atol: 5e-2
  rtol: 5e-3

metrics:
  flops_expr: "12 * B * H * BLOCK_N * D * (M - BLOCK_M)"
  bytes_expr: "2 * B * (H + H_kv) * M * D * dtype_size"
  plots:
    - latency_ms
    - bandwidth_GBs
    - speedup
