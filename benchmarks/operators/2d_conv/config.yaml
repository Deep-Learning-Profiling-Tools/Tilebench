# Single-channel VALID 2D correlation (direct stencil, 2D analog of 1d_conv).
#   output[r,c] = sum_{i,j} kernel[i,j] * input[r+i, c+j]
#   out_rows = input_rows - kernel_rows + 1,  out_cols = input_cols - kernel_cols + 1
# Loose tolerances: fp16 accumulates the kernel window in reduced precision.
verify:
  atol: 0.1
  rtol: 1e-2

benchmark:
  warmup: 20
  repeat: 100
  use_cuda_graph: true
  flush_l2: true
  autotune: false

# Sweep the (square) input side length across 20 points; kernel fixed 3x3.
# Largest case (10240x10240) far exceeds the B200 L2 (~50 MB) so we measure HBM.
case_defaults:
  kernel_rows: 3
  kernel_cols: 3

case_grid:
  input_size:
    expr: "[512 * i for i in range(1, 21)]"   # 512, 1024, ..., 10240 (20 points)
  dtype: ["fp16", "fp32"]

# ---------------------------------------------------------------------------
# Derived-metric expressions
#   out = input_size - kernel + 1   (square: input_rows == input_cols == input_size)
#
# FLOPs: 2 * out_rows * out_cols * kernel_rows * kernel_cols
# Bytes:
#   Read  input:  input_size^2 * dtype_size
#   Read  kernel: kernel_rows * kernel_cols * dtype_size
#   Write output: out_rows * out_cols * dtype_size
# ---------------------------------------------------------------------------
metrics:
  flops_expr: >
    2 * (input_size - kernel_rows + 1) * (input_size - kernel_cols + 1)
    * kernel_rows * kernel_cols

  bytes_expr: >
    input_size * input_size * dtype_size
    + kernel_rows * kernel_cols * dtype_size
    + (input_size - kernel_rows + 1) * (input_size - kernel_cols + 1) * dtype_size

  plots:
    - latency_ms
    - tflops
    - speedup
