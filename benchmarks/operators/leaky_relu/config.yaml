# Leaky ReLU — element-wise y = x if x > 0 else 0.01 * x
# Pure memory-bound; per-dtype defaults sufficient for verify.

benchmark:
  warmup: 20
  repeat: 100
  use_cuda_graph: true
  flush_l2: true
  autotune: false

# Sweep n across 20 points. Max n = 50M matches the LeetGPU performance-measured size.
case_grid:
  n:
    expr: "[2500000 * i for i in range(1, 21)]"   # 2.5M, 5M, ..., 50M (20 points)
  dtype: ["fp16", "bf16", "fp32"]

# ---------------------------------------------------------------------------
# Derived-metric expressions
#   Leaky ReLU is pure memory-bound (1 compare + 1 mul per element);
#   count element count as FLOP proxy.
#   1 read + 1 write per element.
# ---------------------------------------------------------------------------
metrics:
  flops_expr: "n"
  bytes_expr: "n * dtype_size * 2"

  plots:
    - latency_ms
    - bandwidth_GBs
    - speedup
