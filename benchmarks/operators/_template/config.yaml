#     dtype: "fp16"
#     block_size: 1024

# 2) scalable grid (recommended)
case_grid:
  n: [262144, 1048576, 4194304, 16777216, 1000123]
  dtype: ["fp16", "bf16", "fp32"]
  block_size: [256, 1024]
