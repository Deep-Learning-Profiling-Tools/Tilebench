verify:
  atol: 5e-3
  rtol: 5e-3

benchmark:
  warmup: 20
  repeat: 100
  use_cuda_graph: true
  flush_l2: true
  autotune: false

case_defaults:
  batch_size: 1
  n_heads: 32
  head_dim: 128

case_grid:
  seq_len:
    expr: "[1024 * i for i in range(1, 21)]"
  dtype: ["float32", "float16"]

metrics:
  flops_expr: "batch_size * seq_len * n_heads * head_dim"
  bytes_expr: "batch_size * seq_len * n_heads * head_dim * dtype_size * 4"
  plots:
    - latency_ms
    - bandwidth_GBs
    - speedup
