# Row-wise mean reduction over a 2D matrix (M, N) → shape (M,) float32.
# One CTA per row; tiled column scan; always computed in float32.

benchmark:
  warmup: 20
  repeat: 100
  use_cuda_graph: true
  flush_l2: true
  autotune: false

# Sweep N (reduction dimension) across 20 points.
# M=2048 rows mimic a typical LLM prefill batch (2048 tokens).
case_defaults:
  M: 2048

case_grid:
  N:
    expr: "[1024 * i for i in range(1, 21)]"   # 1024, 2048, ..., 20480 (20 points)
  dtype: ["fp16", "bf16", "fp32"]

# ---------------------------------------------------------------------------
# Metrics
#   Mean reduction is memory-bandwidth bound: read input once, write M scalars.
#   FLOPs: M * N additions + M divisions (negligible) ≈ M * N
#   Bytes: read input (M*N*dtype_size); output is M*4 (fp32, negligible vs input)
# ---------------------------------------------------------------------------
metrics:
  flops_expr: "M * N"
  bytes_expr: "M * N * dtype_size"

  plots:
    - latency_ms
    - bandwidth_GBs
    - speedup
