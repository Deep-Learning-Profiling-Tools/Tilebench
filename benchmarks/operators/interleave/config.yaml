# Interleave two arrays — pure data movement (no arithmetic)
# No verify section needed: exact element placement, per-dtype defaults suffice.

benchmark:
  warmup: 20
  repeat: 100
  use_cuda_graph: true
  flush_l2: true
  autotune: false

case_grid:
  n:
    expr: "[1000000 * i for i in range(1, 21)]"   # 1M, 2M, ..., 20M (20 points)
  dtype: ["fp16", "bf16", "fp32", "int8"]

# ---------------------------------------------------------------------------
# Derived-metric expressions
#   Interleave is pure memory-bound: no meaningful FLOPs, use element count as proxy
#   Read A (n) + Read B (n) + Write output (2n) = 4n elements total
# ---------------------------------------------------------------------------
metrics:
  flops_expr: "n"
  bytes_expr: "n * dtype_size * 4"

  plots:
    - latency_ms
    - bandwidth_GBs
    - speedup
