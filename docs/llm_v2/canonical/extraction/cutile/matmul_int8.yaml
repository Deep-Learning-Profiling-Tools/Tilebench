autotune_mechanism: >
  CutileAutotuner.tune_or_cached (cutile_autotune.py lines 98-128) running
  ct.tune.exhaustive_search over _SEARCH_SPACE (lines 16-22) with the
  closures at lines 87-98, cached per shape_key (M, N, K, dtype). The
  winner's occupancy is applied via kernel_with_hints (line 115) and the
  tile shape plus group size are passed as ConstInt arguments (lines
  116-119). Default path uses _DEFAULT_CONFIG (lines 12-14).
  get_last_config returns tm, tn, tk, group_size_m, occupancy (lines
  100-107, 123-124). Audit only.
implementation_freedoms_observed: >
  Tile shape, K step, grouping width and occupancy; program ordering;
  whether B is widened to int32 before masking or decoded with narrower
  arithmetic; whether the four fields are processed as four MMAs per B
  tile (as here) or the four A slabs are concatenated; compile-time versus
  runtime K_b; operand staging as chosen by cuTile.
algorithm_constraints_observed: >
  One kernel, B consumed in its packed uint8 form with the 2-bit decode
  ((byte >> 2i) & 3) - 1 performed inside the mainloop; field i of packed
  row r pairs with A column i * K_b + r; int8 x int8 products accumulated
  exactly in int32; int32 (M, N) output allocated inside run(); no host
  unpack, no cached or prepacked operand, no scratch. The index arithmetic
  k_a = i * num_tiles_kb + j is only correct when K_b is a multiple of TK
  (so that num_tiles_kb * TK == K_b); a faithful re-implementation must
  preserve the slab mapping, not this specific index formula.
fq_boundary:
  bytes_expr: "M * K + K * N // 4 + 4 * M * N"
  flops_expr: "2 * M * N * K"
  consistent_with_timed_boundary: true
  notes: >
    Counts A once in bytes (int8), B once in its packed form (K * N / 4
    bytes = K_b * N) and C once as int32, with the element sizes
    hard-coded rather than via dtype_size. This matches the cuTile kernel,
    which reads the packed B directly and performs the decode in
    registers; run() performs no preprocessing beyond the output
    allocation and assumes no pre-unpacked operand. The reference, by
    contrast, materialises an unpacked int8 B and an fp32 GEMM inside its
    own run(), which is extra reference-side work rather than an F/Q
    boundary issue for cuTile.
notes_for_review:
  - Correctness of the A-column addressing requires K_b % TK == 0 (true for every swept K with the tile sizes in the search space); a tail tile would silently misalign the slabs because num_tiles_kb * TK != K_b.
  - A zero-padded B byte decodes to -1, not 0, so padding on the N or K_b edges yields non-zero operand values that are only harmless because the corresponding C columns are clipped or the paired A columns are zero.
  - K_b is a ConstInt kernel parameter, so the kernel is specialised per swept K value (inferred from ct.Constant semantics).
  - The B tile is loaded once and reused for the four field decodes; the four A slab tiles are loaded separately per packed tile.
  - run() has no **kwargs; an unexpected keyword would raise TypeError.
  - The reference computes in fp32 (TF32 disabled) and casts to int32; results are exact for the generated magnitudes, so the verify tolerance of 0.1 is effectively an exact-match check.
