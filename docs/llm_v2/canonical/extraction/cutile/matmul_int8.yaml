functional_semantics: >
  Integer GEMM between an int8 matrix A (M, K) and a 2-bit-packed weight
  matrix B (K_b, N) of uint8 with K = 4 * K_b, producing int32 C (M, N).
  The reference (impl_torch.py lines 4-19) unpacks B on the host: for
  field i in 0..3, b_val = ((b.int32 & (3 << 2i)) >> 2i).int8 - 1, i.e.
  each 2-bit field is mapped to {-1, 0, 1, 2}, and the field-i values of
  packed row r are placed at unpacked row i * K_b + r (lines 10-14). It
  then disables TF32 and computes torch.matmul(a.float32,
  b_unpacked.float32).to(int32) (lines 17-19); with |a| <= 64 and
  |b| <= 2 the fp32 products and sums are exact for the swept K. The
  generator (tensors.py lines 439-448) draws a = randint(-64, 65) int8
  (M, K) and b = randint(0, 256) uint8 (K_b, N) (the dtype kwarg is
  ignored) and returns (a, b); config.yaml fixes M = N and sweeps K with
  dtype int8 only.
