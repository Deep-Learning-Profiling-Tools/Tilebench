algorithm_family: >
  Tiled integer tensor-core GEMM with in-mainloop weight dequantisation:
  the packed uint8 B tile is loaded once per K_b step and expanded in
  registers into four int8 {-1, 0, 1, 2} operand tiles, each multiplied
  against the matching slab of A with int32 accumulation. No host-side
  unpack, no scratch, no split-K, grouped program ordering for L2
  locality.
reduction_scan_sort_structure: >
  The K reduction is ordered as an outer sequential loop over packed-row
  tiles j and an inner static loop over fields i, so the accumulation
  visits A columns in the order (field 0 of tile 0, field 1 of tile 0,
  ..., field 3 of tile 0, field 0 of tile 1, ...), interleaving the four
  K slabs rather than walking K linearly; the result is exact in int32 so
  the order does not affect the value. Intra-step order is internal to
  ct.mma. No cross-program reduction.
precision:
  input_dtypes: [int8 (A), uint8 packed 2-bit (B)]
  accumulation: int32 (ct.zeros dtype int32, line 46), exact integer arithmetic
  output_dtype: int32 (line 82)
  special_modes: >
    exact integer: int8 x int8 products accumulated in int32 on the tensor
    core; the 2-bit field decode subtracts 1 so fields map to
    {-1, 0, 1, 2}; no TF32, no scaling
  masking_or_padding_values: >
    PaddingMode.ZERO on both loads (lines 53, 60). A zero-padded B byte
    decodes to field value -1 (not 0), so correctness of padded K_b tails
    relies on the paired A columns also being zero; with the swept shapes
    K_b is a multiple of TK and no K tail padding occurs. Stores are
    clipped at (M, N).
intermediate_storage: >
  None. The widened B tile, the four unpacked operand tiles and the int32
  accumulator are register/TMEM resident as lowered by cuTile; no global
  scratch and no unpacked copy of B.
mutation_rules: >
  a and b are never written. c is freshly allocated per call; repeated
  calls are idempotent.
hardware_dispatch_branches: []
tunable_parameters:
  - name: tm
    role: tile size (rows of C per program; ConstInt)
    default_present: true
  - name: tn
    role: tile size (columns of C per program; ConstInt)
    default_present: true
  - name: tk
    role: tile size (packed rows of B, equivalently A columns per field, per reduction step; ConstInt)
    default_present: true
  - name: group_size_m
    role: grouped program ordering width (fixed in the search space; ConstInt)
