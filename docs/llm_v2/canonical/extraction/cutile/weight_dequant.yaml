functional_semantics: >
  Block-wise scale multiplication ("dequantisation" with a per-(TILE_SIZE x
  TILE_SIZE)-block scale): out[i, j] = X[i, j] * S[i // TILE_SIZE,
  j // TILE_SIZE] for X (M, N) and S (ceil(M/TILE_SIZE), ceil(N/TILE_SIZE)),
  all in the same floating dtype (X is not an integer tensor). Reference
  (impl_torch.py lines 4-8): builds row_idx = arange(M)//TILE_SIZE and
  col_idx = arange(N)//TILE_SIZE, gathers a full (M, N) scale matrix by
  advanced indexing S[row_idx[:, None], col_idx[None, :]] (reference-side
  materialisation of the expanded scale), and returns X * scale. Generator
  (tensors.py lines 492-499): X = randn(M, N) with N defaulting to M, S =
  randn(ceil(M/T), ceil(N/T)), returned with ints M, N, TILE_SIZE.
  config.yaml fixes TILE_SIZE via case_defaults and sweeps M and dtype in
  {fp16, bf16, fp32} (N is not swept, so N = M).
run_signature:
  text: "def run(X: torch.Tensor, S: torch.Tensor, M: int, N: int, TILE_SIZE: int, block_size: int = 1024, autotune: bool = False, **kwargs):"
  positional_inputs: [X, S, M, N, TILE_SIZE]
  keyword_params: [block_size, autotune, "**kwargs"]
  returns: single tensor `output` of shape (M, N) and dtype X.dtype (allocated by run)
  get_last_config: present
inputs:
  - name: X
    shape: "(M, N)"
    dtype: "case dtype: fp16 | bf16 | fp32"
    layout: contiguous; flattened to a 1D view X.contiguous().view(-1) (line 50)
    mutated_in_place: false
    notes: null
  - name: S
    shape: "(ceil(M/TILE_SIZE), ceil(N/TILE_SIZE))"
    dtype: same as X
