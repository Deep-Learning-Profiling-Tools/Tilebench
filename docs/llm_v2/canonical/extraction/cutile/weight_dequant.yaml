stages:
  - id: s1
    description: >
      dequant_kernel, grid = (ceil(M*N/TILE), 1, 1) (line 72), flat 1D
      tiling over the flattened matrix. Each CTA computes the flat offsets
      of its tile (lines 24-25), loads the (TILE,) slice of X_flat with
      ZERO padding (line 28), recovers (row, col) = (offset // N,
      offset % N) and the scale-block coordinates (row // TILE_SIZE,
      col // TILE_SIZE) elementwise (lines 31-34), gathers one scale per
      element from S with ct.gather(S, (s_row, s_col), padding_value=0)
      (line 37), multiplies x_tile * scale_tile in the native dtype (line
      39) and stores the tile to out_flat (line 41).
    kind: kernel
    lines: [21, 41]
    launches: "1 (grid = ceil(M*N/TILE) CTAs)"
    depends_on: []
    fusable_with: none
    produces: output (final result)
algorithm_family: >
  Elementwise multiply with a block-constant broadcast scale, implemented
  as a flat 1D map with per-element integer division/modulo to recover the
  scale-block index and a per-element gather of the scale (no 2D tiling,
  no per-tile scale hoisting).
reduction_scan_sort_structure: >
  None; purely elementwise.
precision:
  input_dtypes: [fp16, bf16, fp32]
  accumulation: n/a; the single multiply is performed in the native input dtype (no fp32 upcast), identical to the reference X * scale
  output_dtype: X.dtype
  special_modes: none
  masking_or_padding_values: "ZERO padding on the X load (line 28) and padding_value=0 on the scale gather (line 37) for the tail tile; padded lanes multiply 0*0 and lie outside the stored range"
intermediate_storage: >
  None (the reference materialises an (M, N) scale matrix; the cuTile
  implementation does not).
mutation_rules: >
  X and S are not modified; output is fully overwritten; idempotent.
  Tuning launches write into the real out_flat buffer (args_fn, line 61),
  which the final launch overwrites.
hardware_dispatch_branches: []
tunable_parameters:
  - name: tile
    role: tile size (elements per CTA)
    default_present: true
  - name: occupancy
    role: occupancy hint (replace_hints)
    default_present: true
autotune_mechanism: >
  CutileAutotuner.tune_or_cached wrapping ct.tune.exhaustive_search over
  the tile x occupancy cartesian space (_SEARCH_SPACE, lines 14-18), keyed
  by (M, N, TILE_SIZE, dtype) (line 57); winner applied via the memoised
  kernel_with_hints kernel (line 73). get_last_config written only on the
  autotune path (lines 64-68). Audit only.
implementation_freedoms_observed: >
  Tile size and occupancy; 1D flat tiling with per-element gather (this
  implementation) vs 2D tiling aligned to the scale blocks so that one
  scale is loaded per block; whether to upcast to fp32 (this implementation
  does not); whether N and TILE_SIZE are compile-time constants.
algorithm_constraints_observed: >
  Keep: out[i, j] = X[i, j] * S[i // TILE_SIZE, j // TILE_SIZE] with
  floor-division block indexing (partial edge blocks map to the last scale
  row/column, which is why S has ceil-sized dims), native-dtype multiply,
  output in a fresh (M, N) buffer of X's dtype, no materialised expanded
  scale required.
fq_boundary:
  bytes_expr: "2 * M * M * dtype_size + ((M + TILE_SIZE - 1) // TILE_SIZE) ** 2 * dtype_size"
  flops_expr: "M * M"
  consistent_with_timed_boundary: true
  notes: >
    Read X, write output and read S once, written for the square case
    N = M that the generator produces (run() supports general N but the
    formula does not). run() performs no extra data movement (one
    allocation, views). The kernel gathers a scale per element rather than
    per block, so S is requested M*N times at the gather level; the formula
    counts it once, i.e. it assumes those repeated requests are served
    from cache. Unlike the reference, the cuTile path never materialises
    the (M, N) scale matrix, so the formula matches the kernel's intended
    traffic.
notes_for_review:
  - N and TILE_SIZE are ConstInt kernel arguments, so every swept M (with N = M) compiles a new specialisation.
  - The per-element integer division and modulo (flat index to 2D) plus the per-element 2D gather are a mapping choice; a 2D-tiled variant would load one scale per scale block.
  - M is never passed to the kernel; the grid is derived from total = M*N and out-of-range lanes are handled by padding.
  - block_size is accepted but ignored; the default path uses _DEFAULT_CONFIG.tile.
  - The operator name suggests integer-weight dequantisation but X is a float tensor of the same dtype as S; semantically it is a block-scaled multiply.
  - bytes_expr hardcodes the square shape (M * M) while run() and the generator accept a distinct N.
