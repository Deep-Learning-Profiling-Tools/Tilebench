functional_semantics: >
  Reference (impl_torch.py 5-14) is torch.nn.functional.conv2d(input, weight, bias=None,
  stride=stride, padding=padding, groups=groups), no reference-side preprocessing.
  For input (batch, in_channels, H, W) and weight (out_channels, in_channels // groups,
  kH, kW): out[b, oc, oh, ow] = sum_{ic_local, kh, kw}
  input[b, g*icpg + ic_local, oh*stride + kh - padding, ow*stride + kw - padding]
  * weight[oc, ic_local, kh, kw], g = oc // (out_channels // groups), zero padding
  outside the spatial extent, out_H = (H + 2*padding - kH)//stride + 1 (same for W).
  Isotropic stride/padding (one int each). Generator (tensors.py 466-478) builds
  contiguous randn input with W = H and weight, returns (input, weight, stride, padding,
  groups); config fixes batch, channels, kernel_size, stride, padding, groups and sweeps
  H and dtype.
run_signature:
  text: "def run(input: torch.Tensor, weight: torch.Tensor, stride: int = 1, padding: int = 1, groups: int = 1, block_size: int = 1024, autotune: bool = False, **kwargs)"
  positional_inputs: [input, weight, stride, padding, groups]
  keyword_params: [block_size, autotune, kwargs]
  returns: single tensor output of shape (batch, out_channels, out_H, out_W), dtype = input.dtype
  get_last_config: present
inputs:
  - name: input
    shape: "(batch, in_channels, H, W)"
    dtype: fp16 or fp32 (config case_grid dtype)
    layout: contiguous (asserted at impl_cutile.py line 172)
    mutated_in_place: false
    notes: flat view input.view(-1) (line 184); 4 strides passed to the kernel (line 198).
  - name: weight
    shape: "(out_channels, in_channels // groups, kH, kW)"
    dtype: same as input
    layout: contiguous (asserted at line 172)
    mutated_in_place: false
    notes: flat view weight.view(-1) (line 185); strides passed (line 199).
  - name: stride
    shape: scalar int
    dtype: int
    layout: n/a
    mutated_in_place: false
    notes: passed twice as (stride_h, stride_w) (line 195); only isotropic stride supported by run().
  - name: padding
    shape: scalar int
    dtype: int
    layout: n/a
    mutated_in_place: false
    notes: passed twice as (pad_h, pad_w) (line 196); symmetric zero padding.
  - name: groups
    shape: scalar int
    dtype: int
    layout: n/a
    mutated_in_place: false
    notes: grid dimension 2 (lines 213, 231); in_channels_per_group * groups == in_channels asserted (line 175).
outputs:
  - name: output
    shape: "(batch, out_channels, out_H, out_W)"
    dtype: input.dtype
    allocated_by: run
    aliasing: none
preprocessing:
  - description: shape unpacking, out_H/out_W and out_channels_per_group arithmetic, contiguity assert
