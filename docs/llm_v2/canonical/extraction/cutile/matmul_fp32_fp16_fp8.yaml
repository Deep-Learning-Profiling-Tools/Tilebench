functional_semantics: >
  Plain GEMM C = A @ B with A (M, K) and B (K, N) of the same dtype and C
  in that dtype. The reference (impl_torch.py) sets
  torch.backends.cuda.matmul.allow_tf32 = True at import (line 4), so the
  fp32 case is TF32 cuBLAS; fp32 and fp16 use torch.matmul(a, b) (line
  27). For a.dtype == float8_e4m3fn (lines 22-26) it calls
  torch._scaled_mm(a, b_col, scale_a, scale_b, out_dtype=bfloat16) and
  casts the bf16 result back to fp8_e4m3fn, where _fp8_args (lines 10-18)
  returns a column-major copy of B (b.t().contiguous().t()) and all-ones
  fp32 per-row / per-column scale vectors, cached in the module dict
  _fp8_cache keyed by (a.data_ptr(), b.data_ptr(), a.shape, b.shape). Thus
  the reference's fp8 path is unit-scaled (mathematically a plain GEMM),
  double-rounds fp32 -> bf16 -> fp8 on output, and performs an
  operand-repacking step that is cached across calls on the reference
  side. The generator (tensors.py lines 416-436) scales both operands by
  1/sqrt(K); fp8 operands are drawn in fp32 and cast; both are returned
  row-major as (a, b). config.yaml fixes M = N and sweeps K over fp32,
  fp16 and fp8_e4m3fn with a loose verify tolerance.
run_signature:
  text: "def run(a: torch.Tensor, b: torch.Tensor, block_size: int = None, autotune: bool = False) -> torch.Tensor:"
  positional_inputs: [a, b]
  keyword_params: [block_size, autotune]
  returns: single tensor C of shape (M, N) and dtype a.dtype
  get_last_config: present
inputs:
  - name: a
    shape: "(M, K)"
    dtype: "T in {fp32, fp16, fp8_e4m3fn} (asserted equal to b.dtype, line 78)"
    layout: contiguous row-major
    mutated_in_place: false
    notes: loaded as (TM, TK) tiles by block index with zero padding (lines 62-63); K is a ConstInt kernel parameter (line 39)
  - name: b
    shape: "(K, N)"
    dtype: same as a
    layout: contiguous row-major, consumed as-is (no transpose, no column-major copy)
    mutated_in_place: false
    notes: loaded as (TK, TN) tiles by block index with zero padding (lines 64-65)
outputs:
