functional_semantics: >
  Integer histogram. Reference (impl_torch.py line 9):
  torch.bincount(input.to(int64), minlength=num_bins).to(int32), i.e. hist[b] = |{i : input[i] == b}|
  for b in [0, num_bins). Input (tensors.py 534-558) is int32 of length N with values
  arange(N) % num_bins (deterministic, all in range, near-uniform), passed with the ints N and
  num_bins. Output is an int32 vector of length num_bins (bincount's length equals num_bins
  because max(input) = num_bins - 1). Verification is exact (atol = rtol = 0).
run_signature:
  text: |
    def run(input: torch.Tensor, N: int, num_bins: int,
            block_size: int = None, autotune: bool = False, **kwargs):
  positional_inputs: [input, N, num_bins]
  keyword_params: [block_size, autotune, "**kwargs"]
  returns: single tensor `histogram` of shape (num_bins,), dtype int32
  get_last_config: present
