    cached_across_calls: false
    notes: null
  - description: rms_w.contiguous()
    lines: [74, 74]
    kind: metadata
    inside_run: true
    cached_across_calls: false
    notes: no-op for the generator's contiguous weight.
stages:
  - id: s1
    description: >
      One CTA per row (grid = (batch_M, 1, 1), lines 77 and 97-98). Pass 1
      (lines 27-37): loop j over ceil(K/TILE) column tiles; load x[row, tile j]
      as a (1, TILE) tile with ZERO padding, cast to fp32, accumulate x*x
      lane-wise into a (1, TILE) fp32 accumulator; after the loop a single
      ct.sum over the TILE lanes gives the row sum of squares; rstd =
      rsqrt(sum / N + eps) where N is the true K (padding lanes contribute
      exactly 0 to the sum and are not counted in the mean). Pass 2 (lines
      40-54): loop j again; re-load the same x tile and the matching (TILE,)
      slice of rms_w (both ZERO-padded, both cast to fp32), compute
      x * rstd * w in fp32, cast to x.dtype, store into out[row, tile j].
    kind: kernel
    lines: [21, 54]
    launches: "1 (grid = batch_M CTAs; each CTA loops twice over ceil(K/TILE) tiles)"
    depends_on: []
    fusable_with: none
    produces: out (final result); no global intermediates
algorithm_family: >
  Row-wise two-pass RMS normalisation: pass 1 sum of squares, pass 2
  normalise-and-scale, with x re-read from global memory in pass 2 (no
  row caching in registers/shared memory across passes).
reduction_scan_sort_structure: >
  Row reduction in two levels: (a) sequential over column tiles, lane-wise
  (element j of the accumulator sums x[row, j + t*TILE]^2 over tiles t, in
  increasing t), then (b) one tile-wide ct.sum over the TILE lanes whose
  internal order is left to the cuTile compiler. The division by N and the
  eps add happen once on the reduced scalar; rsqrt is applied to that
  scalar. No scan, no sort.
precision:
  input_dtypes: [fp16, bf16, fp32]
  accumulation: fp32 for the sum of squares and for the normalise multiply (explicit ct.astype to ct.float32 on every loaded tile)
  output_dtype: x.dtype (single downcast at the final multiply, line 53)
  special_modes: none visible (no fast-math or approximate-rsqrt flags in the source)
  masking_or_padding_values: "ZERO padding on all three loads (x in both passes, rms_w); out-of-range lanes of the last tile are stored through ct.store, whose bounds handling is not explicit in this file"
intermediate_storage: >
  None in global memory. Per-CTA register/tile state only: a (1, TILE) fp32
  partial-sum tile and a scalar rstd.
mutation_rules: >
  Neither x nor rms_w is modified. out is fully overwritten on every call;
  repeated calls are idempotent. The autotune path's args_fn (line 85)
  points the tuning launches at the real out_2d buffer, which is harmless
  because the final launch overwrites every element.
hardware_dispatch_branches: []
tunable_parameters:
  - name: tile_size
    role: tile size (column-tile width TILE)
    default_present: true
  - name: occupancy
    role: occupancy hint (replace_hints)
    default_present: true
autotune_mechanism: >
  CutileAutotuner.tune_or_cached (cutile_autotune.py lines 98-128) wrapping
  ct.tune.exhaustive_search over the tile_size x occupancy cartesian space
  (_SEARCH_SPACE, lines 14-18), keyed by (batch_M, K, dtype) (line 81),
  with hints_fn applying occupancy; the winner is cached per key and
  applied via the memoised kernel_with_hints kernel (line 96) for both the
  default and the autotune launch. get_last_config returns the winner's
  tile_size/occupancy; it is written only on the autotune path (lines 88-92).
  Audit only.
implementation_freedoms_observed: >
  Column-tile width, occupancy, the per-load mapping annotations
  allow_tma=False and latency=1 (lines 31, 43, 49, 54), whether the row is
  kept on-chip between the two passes (this implementation re-reads it),
  internal order of the lane-wide ct.sum, and the choice of one CTA per row
  (the host grid is simply batch_M).
algorithm_constraints_observed: >
  Keep: normalisation over the last dimension with mean = sum/K (true K,
  not padded K), eps added inside the rsqrt, fp32 accumulation and fp32
  normalise multiply with a single downcast to the input dtype, weight
  applied after the rstd scaling (x * rstd * w), output written to a fresh
  buffer. The two-pass structure (reduce, then normalise) is the inherent
  dependency: every output element needs the full-row statistic first.
fq_boundary:
  bytes_expr: "n * dtype_size * 3"
  flops_expr: "4 * n"
  consistent_with_timed_boundary: unclear
  notes: >
    The config's case parameters are batch, M, K and dtype (config.yaml lines
    8-15) but both metric expressions use `n`, whose derivation is not visible
    in the files read for this extraction. If n = batch*M*K, 3*n*dtype_size
    counts one read of x, one write of out and one more read of x (the
    kernel's pass-2 re-read), or equivalently a generous bound; rms_w (K
    elements per row) is not counted. run() performs no extra timed data
    movement (views and one empty allocation only), so the boundary itself
    is clean; only the meaning of n is unresolved here.
notes_for_review:
  - The metric expressions reference `n`, which is not a case parameter of this operator; its definition lives outside the files this extraction may read.
  - The kernel's ConstInt parameter is called N but receives K (the row length), so the kernel is specialised per K and the host-side variable naming (K vs N) is inconsistent.
  - run() has no block_size keyword and no **kwargs, unlike most operators; eps is exposed as a semantic keyword with the same default as the torch reference.
  - Pass 2 re-loads x from global memory; whether that second read is served by L2 is a hardware question, not visible in the source.
  - Loads carry allow_tma=False and latency=1 annotations; these are mapping hints, not tunables (they are fixed in the source).
  - ct.store on the last partial tile relies on cuTile's implicit out-of-bounds clipping; the source does not mask explicitly.
