functional_semantics: >
  Root-mean-square normalisation over the last dimension with a learned
  per-feature weight: for every row r of x (all leading dims flattened),
  y[r, :] = x[r, :] * rsqrt(mean_k(x[r, k]^2) + eps) * w[:], where K is the
  size of the last dimension and the mean is 1/K times the sum of squares.
  Reference (impl_torch.py lines 5-6): torch.nn.functional.rms_norm(x,
  x.shape[-1:], weight=rms_w, eps=eps) with eps defaulting to 1e-6. No
  reference-side preprocessing. Generator (tensors.py lines 207-210): x of
  shape (batch, M, K) and rms_w of shape (K,), both torch.randn in the case
  dtype; config.yaml fixes batch and M via case_defaults and sweeps K and
  dtype.
run_signature:
  text: "def run(x: torch.Tensor, rms_w: torch.Tensor, eps: float = 1e-6, autotune: bool = False) -> torch.Tensor:"
  positional_inputs: [x, rms_w]
  keyword_params: [eps, autotune]
  returns: single tensor `out`, same shape and dtype as x (allocated by run)
  get_last_config: present
inputs:
  - name: x
    shape: "(batch, M, K) in general any (..., K); viewed as (batch*M, K)"
    dtype: "case dtype: fp16 | bf16 | fp32"
    layout: contiguous row-major (x.contiguous().reshape(batch_M, K) at line 71; a copy only if the caller passes a non-contiguous tensor)
    mutated_in_place: false
    notes: K = x.shape[-1] is passed to the kernel as the ConstInt argument named N (line 22), so the kernel is specialised per K.
  - name: rms_w
    shape: "(K,)"
    dtype: same as x
    layout: contiguous (rms_w.contiguous() at line 74)
    mutated_in_place: false
    notes: cast to fp32 inside the kernel before use (lines 41-46).
  - name: eps
    shape: scalar
    dtype: python float (default 1e-6)
    layout: n/a
    mutated_in_place: false
    notes: passed to the kernel as a runtime scalar argument (line 98); added inside rsqrt (line 37).
outputs:
  - name: out
    shape: x.shape
    dtype: x.dtype
    allocated_by: run
    aliasing: none
preprocessing:
  - description: flatten leading dims of x into a 2D (batch_M, K) view
    lines: [67, 71]
    kind: metadata
    inside_run: true
    cached_across_calls: false
    notes: reshape of a contiguous tensor; no data movement for the generator's inputs.
  - description: allocate out = torch.empty_like(x) and take its 2D view out_2d
    lines: [72, 73]
    kind: allocation
