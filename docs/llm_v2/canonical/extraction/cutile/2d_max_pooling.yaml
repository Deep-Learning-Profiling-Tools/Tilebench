functional_semantics: >
  Reference (impl_torch.py 5-8): x = input.view(N, C, H, W); y =
  torch.nn.functional.max_pool2d(x, kernel_size, stride=stride, padding=padding)
  (dilation 1, ceil_mode False, implicit -inf padding); return y.reshape(-1).
  out[n, c, oh, ow] = max_{kh, kw in [0, kernel_size)} x[n, c, oh*stride + kh - padding,
  ow*stride + kw - padding] over in-bounds positions only; H_out = (H + 2*padding -
  kernel_size)//stride + 1 (same for W). The generator (tensors.py 481-489) produces a
  flat randn tensor of N*C*H*W elements with W = H and returns
  (input_flat, N, C, H, W, kernel_size, stride, padding). Reference-side preprocessing:
  only a view and a reshape (no copies).
run_signature:
  text: "def run(input, N, C, H, W, kernel_size, stride, padding, block_size: int = 1024, autotune: bool = False, **kwargs)"
  positional_inputs: [input, N, C, H, W, kernel_size, stride, padding]
  keyword_params: [block_size, autotune, kwargs]
  returns: single flat tensor of N*C*H_out*W_out elements, dtype = input.dtype (empty tensor if total_out <= 0)
  get_last_config: present
inputs:
  - name: input
    shape: "(N*C*H*W,) flat; viewed as (N*C, H, W) at line 63"
    dtype: fp16, bf16 or fp32 (config case_grid dtype)
    layout: contiguous 1-D (generator torch.randn); .view requires contiguity
    mutated_in_place: false
    notes: ""
  - name: N, C, H, W
    shape: scalar ints
    dtype: int
    layout: n/a
    mutated_in_place: false
    notes: logical NCHW shape of the flat input.
  - name: kernel_size, stride, padding
    shape: scalar ints
    dtype: int
    layout: n/a
    mutated_in_place: false
    notes: passed to the kernel as ConstInt (lines 24-26), i.e. compile-time constants (one kernel specialisation per combination; fixed by config case_defaults).
outputs:
