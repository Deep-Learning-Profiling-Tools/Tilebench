functional_semantics: >
  Layer normalisation over the last axis with affine parameters:
  y[..., k] = (x[..., k] - mean) * rsqrt(var + eps) * weight[k] + bias[k],
  where mean and var are the mean and biased (population) variance of the
  row. The reference (impl_torch.py line 6) is
  torch.nn.functional.layer_norm(x, (x.shape[-1],), weight, bias, eps)
  with eps defaulting to 1e-5; the reference-side internal statistics
  precision is whatever F.layer_norm uses (not visible in the file). The
  generator (tensors.py lines 403-407) draws x = randn(batch, M, K),
  weight = randn(K), bias = randn(K), all in the case dtype, and returns
  (x, weight, bias); config.yaml fixes batch = 1, M = 2048 and sweeps K and
  dtype. eps is not supplied by the generator or config, so both sides use
  their 1e-5 default.
run_signature:
  text: "def run(x: torch.Tensor, weight: torch.Tensor, bias: torch.Tensor, eps: float = 1e-5, autotune: bool = False) -> torch.Tensor:"
  positional_inputs: [x, weight, bias]
  keyword_params: [eps, autotune]
  returns: single tensor with the shape and dtype of x
  get_last_config: present
inputs:
  - name: x
    shape: "(batch, M, K); viewed as (batch*M, K) inside run (line 82)"
    dtype: "T in {fp16, bf16, fp32}"
    layout: contiguous row-major (x.contiguous() at line 82 is a no-op for generator tensors)
    mutated_in_place: false
    notes: K is passed to the kernel as the ConstInt parameter N (lines 22, 97, 110)
  - name: weight
    shape: "(K,)"
    dtype: same as x
    layout: contiguous 1-D (weight.contiguous() at line 85)
    mutated_in_place: false
    notes: loaded per column tile as a (TILE_SIZE,) 1-D tile and upcast to fp32 (lines 51-56)
  - name: bias
    shape: "(K,)"
    dtype: same as x
    layout: contiguous 1-D (bias.contiguous() at line 86)
    mutated_in_place: false
    notes: loaded per column tile as a (TILE_SIZE,) tile and upcast to fp32 (lines 57-62)
  - name: eps
    shape: scalar
    dtype: python float, runtime kernel argument (line 22)
    layout: n/a
    mutated_in_place: false
    notes: default 1e-5, matching the reference default
outputs:
  - name: out
    shape: "(batch, M, K) (same as x)"
    dtype: x.dtype
    allocated_by: run
    aliasing: none
preprocessing:
  - description: K = x.shape[-1]; batch_M = x.numel() // K; x_2d = x.contiguous().reshape(batch_M, K)
