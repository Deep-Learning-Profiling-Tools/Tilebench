stages:
  - id: s0
    description: views, contiguity checks and output allocation (see preprocessing)
    kind: allocation
    lines: [78, 86]
    launches: "1"
    depends_on: []
    fusable_with: "none"
    produces: out buffer uninitialised; 2-D views; contiguous weight/bias handles
  - id: s1
    description: >
      One program per row, grid (batch*M, 1, 1) at line 89, launched at
      lines 108-110. Pass 1 (lines 27-37): loop over ceil(N/TILE_SIZE)
      column tiles (N ConstInt, compile-time trip count), load the
      (1, TILE_SIZE) tile of x with zero padding, allow_tma=False,
      latency=1, upcast to fp32, and accumulate lane-wise sum_x and sum_x2.
      Statistics (lines 39-41): mean = sum(sum_x)/N, var = sum(sum_x2)/N -
      mean*mean (single-pass E[x^2] - E[x]^2 formula, biased variance),
      rstd = rsqrt(var + eps). Pass 2 (lines 44-64): re-load each x tile,
      load the matching (TILE_SIZE,) tiles of weight and bias (zero padded),
      upcast all three to fp32, compute (xj - mean) * rstd * wj + bj, cast
      to x.dtype and store the (1, TILE_SIZE) tile of out with
      allow_tma=False, latency=1.
    kind: kernel
    lines: [22, 64]
    launches: "batch*M (one program per row)"
    depends_on: [s0]
    fusable_with: "none"
    produces: out (final result); no global intermediates
algorithm_family: >
  Row-wise two-pass layer normalisation in one kernel: a statistics pass
  that streams the row accumulating fp32 sum and sum of squares, then a
  second streaming pass that re-reads the row (and the weight/bias
  vectors) and applies the affine normalisation. Variance uses the
  single-pass E[x^2] - mean^2 formula rather than a centred second pass.
reduction_scan_sort_structure: >
  Pass 1 accumulates sum_x and sum_x2 sequentially over column tiles into
  two (1, TILE_SIZE) fp32 lane vectors; each is then reduced once with
  ct.sum over the lanes (internal tree order unclear) and divided by N.
  Zero-padded columns contribute 0 to both sums and N is the true row
  length, so padding does not bias the statistics.
precision:
  input_dtypes: [fp16, bf16, fp32]
  accumulation: fp32 (ct.astype to float32 of x, weight and bias tiles; accumulators ct.full float32, lines 27-28)
  output_dtype: x.dtype (ct.astype at line 63)
  special_modes: >
    biased variance via E[x^2] - mean^2 in fp32 (line 40), which is subject
    to cancellation for rows with large mean relative to spread; rsqrt in
    fp32 (line 41)
  masking_or_padding_values: PaddingMode.ZERO on every load (x, weight, bias; lines 33, 48, 54, 60); stores clipped at K (line 64); no explicit masks
intermediate_storage: >
  None. Lane accumulators, mean and rstd are register resident; no global
  scratch.
mutation_rules: >
  x, weight and bias are never written. out is freshly allocated per call;
  repeated calls are idempotent.
hardware_dispatch_branches: []
tunable_parameters:
  - name: tile_size
    role: tile size (columns per loop iteration; ConstInt kernel argument)
    default_present: true
  - name: occupancy
    role: occupancy hint applied via replace_hints
    default_present: true
autotune_mechanism: >
  CutileAutotuner.tune_or_cached (cutile_autotune.py lines 98-128) running
  ct.tune.exhaustive_search over _SEARCH_SPACE (lines 14-18) with the
  closures at lines 92-99, cached per shape_key (batch_M, K, dtype). The
  winner's occupancy is applied via kernel_with_hints (line 108) and the
  tile size is passed as a ConstInt argument (line 110). Default path uses
  _DEFAULT_CONFIG (line 12). get_last_config returns tile_size and
  occupancy (lines 100-104, 115-116). The loads/stores carry fixed
  (non-tuned) hints allow_tma=False and latency=1. Audit only.
implementation_freedoms_observed: >
  Column tile width and occupancy; TMA or non-TMA loads and latency hints;
  whether the row is re-read or kept on chip between passes; the variance
  formula (single-pass E[x^2]-mean^2 versus centred two-pass or Welford);
  whether weight/bias are loaded per tile or hoisted; compile-time versus
  runtime row length.
algorithm_constraints_observed: >
  Per-row mean and biased variance computed in fp32 over the full row;
  eps added to the variance inside rsqrt; affine transform
  (x - mean) * rstd * weight + bias in fp32 then cast to the input dtype;
  output has the input's shape and dtype and is allocated inside run(); no
  scratch; weight and bias consumed as 1-D contiguous vectors with no
  host-side preprocessing.
fq_boundary:
  bytes_expr: "n * dtype_size * 3"
  flops_expr: "6 * n"
  consistent_with_timed_boundary: unclear
  notes: >
    The expressions reference a symbol n that is not one of this operator's
    case parameters (batch, M, K); how the metrics layer binds n could not
    be verified from the files in scope. If n is the element count of x,
    bytes = 3 passes of x (one read per pass plus the write), which matches
    the kernel's read-twice/write-once pattern rather than the
    compulsory read-once/write-once traffic used by sibling operators, and
    the weight/bias reads are not counted. run() performs no preprocessing
    beyond views and the output allocation, all inside the timed region,
    and assumes no prepacked inputs.
notes_for_review:
  - run() has no **kwargs and no block_size keyword; an extra keyword from the engine would raise TypeError (not verified, engine not in scope).
  - Variance is computed as E[x^2] - mean^2 in a single pass; numerically different from a centred reference for ill-conditioned rows.
  - N (= K) is a ConstInt kernel parameter, so the kernel is specialised per swept K value (inferred from ct.Constant semantics).
  - The second pass re-loads x; whether bytes_expr intends to count that re-read depends on the meaning of n (unclear).
  - weight and bias are generated in the input dtype and upcast per tile inside the kernel; no host cast.
