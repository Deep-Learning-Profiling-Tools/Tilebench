functional_semantics: >
  Reference (impl_torch.py 5-14) is torch.nn.functional.conv3d(input, weight, bias=None,
  stride=stride, padding=padding, groups=groups), no reference-side preprocessing.
  For input (batch, in_channels, D, H, W) and weight (out_channels, in_channels // groups,
  kD, kH, kW): out[b, oc, od, oh, ow] = sum_{ic_local, kd, kh, kw}
  input[b, g*icpg + ic_local, od*stride + kd - padding, oh*stride + kh - padding,
  ow*stride + kw - padding] * weight[oc, ic_local, kd, kh, kw], zero padding outside the
  volume, out_X = (X + 2*padding - kX)//stride + 1. Isotropic stride/padding. Generator
  (tensors.py 350-363) builds contiguous randn input with W = H and a cubic kernel,
  returns (input, weight, stride, padding, groups); config fixes batch, channels, D,
  kernel_size, stride, padding, groups and sweeps H and dtype.
run_signature:
  text: "def run(input: torch.Tensor, weight: torch.Tensor, stride: int = 1, padding: int = 1, groups: int = 1, block_size: int = 1024, autotune: bool = False, **kwargs)"
  positional_inputs: [input, weight, stride, padding, groups]
  keyword_params: [block_size, autotune, kwargs]
  returns: single tensor output of shape (batch, out_channels, out_D, out_H, out_W), dtype = input.dtype
  get_last_config: present
inputs:
  - name: input
    shape: "(batch, in_channels, D, H, W)"
    dtype: fp16 or fp32 (config case_grid dtype)
    layout: contiguous (asserted at impl_cutile.py line 188)
    mutated_in_place: false
    notes: flat view input.view(-1) (line 201); 5 strides passed (line 216).
  - name: weight
    shape: "(out_channels, in_channels // groups, kD, kH, kW)"
    dtype: same as input
    layout: contiguous (asserted at line 188)
    mutated_in_place: false
    notes: flat view weight.view(-1) (line 202); strides passed (line 217).
  - name: stride
    shape: scalar int
    dtype: int
    layout: n/a
    mutated_in_place: false
    notes: passed three times as (stride_d, stride_h, stride_w) (line 213); isotropic only.
  - name: padding
    shape: scalar int
    dtype: int
    layout: n/a
    mutated_in_place: false
    notes: passed three times as (pad_d, pad_h, pad_w) (line 214); symmetric zero padding.
  - name: groups
    shape: scalar int
    dtype: int
    layout: n/a
    mutated_in_place: false
    notes: grid dimension 2 (lines 231, 249); in_channels_per_group * groups == in_channels asserted (line 191).
outputs:
  - name: output
    shape: "(batch, out_channels, out_D, out_H, out_W)"
    dtype: input.dtype
    allocated_by: run
    aliasing: none
