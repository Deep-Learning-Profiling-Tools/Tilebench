functional_semantics: >
  Grouped 2-D cross-correlation without bias, as computed by
  torch.nn.functional.conv2d(input, weight, bias=None, stride, padding, groups)
  (impl_torch.py lines 7-14), with the same scalar stride and padding applied
  to both spatial axes. With Cin_g = in_channels // groups and
  Cout_g = out_channels // groups, for group g = oc // Cout_g:
  out[b, oc, oh, ow] = sum_{ic_local < Cin_g} sum_{kh < kH} sum_{kw < kW}
  input[b, g*Cin_g + ic_local, oh*stride + kh - padding, ow*stride + kw - padding]
  * weight[oc, ic_local, kh, kw], with out-of-range input positions contributing
  zero, out_H = (H + 2*padding - kH) // stride + 1 and likewise out_W. No kernel
  flip. The reference performs no preprocessing and sets no precision flags.
  The generator (tensors.py 466-478) uses square spatial dims W = H and
  torch.randn for input (batch, in_channels, H, W) and weight
  (out_channels, in_channels // groups, kernel_size, kernel_size), and passes
  stride, padding, groups positionally.
run_signature:
  text: |
    def run(
        input: torch.Tensor,
        weight: torch.Tensor,
        stride: int = 1,
        padding: int = 1,
        groups: int = 1,
        block_size: int = 1024,
        autotune: bool = False,
        **kwargs,
    ):
  positional_inputs: [input, weight, stride, padding, groups]
  keyword_params: [block_size, autotune, kwargs]
  returns: single tensor output of shape (batch, out_channels, out_H, out_W), dtype of input
  get_last_config: present
inputs:
