stages:
  - id: s1
    description: >
      Implicit-GEMM convolution kernel. Grid axis 0 tiles the flattened
      (batch, out_H, out_W) row space, axis 1 tiles the output channels of one
      group, axis 2 is the group (lines 35-53). Each program holds an fp32
      accumulator tile (line 55) and loops over the flattened reduction axis
      R = in_channels_per_group * kH * kW in tiles (lines 58-105): per tile it
      decodes (ic_local, kh, kw) from the flat index (lines 63-65), computes
      the input coordinates (lines 71-72), masks out-of-range rows/positions/
      features (lines 75-80), gathers the input patch tile with other=0.0 and
      clamped pointers (lines 83-90), gathers the weight tile (lines 93-102),
      and accumulates with tl.dot (line 105). The accumulator is cast and
      stored with a mask (lines 108-116). Launched at lines 199-223.
    kind: kernel
    lines: [14, 116]
    launches: "1 launch; ceil(batch*out_H*out_W / BLOCK_rows) x ceil(out_channels_per_group / BLOCK_oc) x groups programs"
    depends_on: []
    fusable_with: none
    produces: output
algorithm_family: >
  Implicit-GEMM (im2col-free) grouped 2-D convolution: output viewed as a
  (batch*out_H*out_W) x out_channels matrix per group, reduction over the
  flattened (input channel, kh, kw) index, patches gathered on the fly with
  masked loads so zero padding is realised by masking. Single kernel,
  tensor-core dot.
reduction_scan_sort_structure: >
  Reduction over R = (in_channels // groups) * kH * kW, flattened
  channel-major then kh then kw (lines 63-65), consumed sequentially in
  increasing r in fixed-width tiles, each folded into the fp32 accumulator by
  one tl.dot (line 105). No split-K, no atomics; intra-tile order is the MMA
  hardware's.
precision:
  input_dtypes: [fp16, fp32]
  accumulation: fp32 (tl.zeros float32 at line 55; tl.dot accumulates in fp32)
  output_dtype: input dtype (cast at line 116)
  special_modes: "tl.dot(..., input_precision=\"tf32\") at line 105: fp32 operands rounded to TF32 inside the MMA; fp16 used natively"
  masking_or_padding_values: "other=0.0 for out-of-range input positions (zero padding) and out-of-range feature/channel lanes (lines 90, 102); pointers clamped with tl.where (lines 87-88)"
intermediate_storage: >
  None beyond the output buffer; the accumulator lives in registers.
mutation_rules: >
  No input is modified; the output is freshly allocated per call; repeated
  calls are idempotent.
hardware_dispatch_branches:
  - condition: "config.yaml verify.arch_overrides.cdna3 (not in impl_triton.py)"
    lines: [6, 11]
    changes: >
      Verification tolerance only: atol is raised from 1e-1 to 2e-1 when the
      benchmark runs on CDNA3, because the ROCm fp16 conv2d reference deviates
      more from strict fp32 (comment at config.yaml lines 1-5). The Triton
      kernel itself has no architecture branch.
    algorithmic: false
tunable_parameters:
  - name: BLOCK_SIZE_BATCH_HEIGHT_WIDTH
    role: tile size (rows of the flattened batch x out_H x out_W space)
    default_present: true
  - name: BLOCK_SIZE_IN_FEAT
    role: tile size (reduction dimension)
    default_present: true
  - name: BLOCK_SIZE_OUT_FEAT
    role: tile size (output channels)
    default_present: true
  - name: num_warps
    role: warps
    default_present: true
  - name: num_stages
    role: stages
    default_present: true
autotune_mechanism: >
  triton.autotune (lines 119-142) over a cartesian product of the three tile
  sizes, num_warps and num_stages filtered by a tile-area bound, keyed on
  batch, in_channels, out_channels, in_H, in_W, kH, kW, groups, stride_h,
  stride_w, pad_h, pad_w, warmup=1, rep=3. The non-autotuned path launches the
  undecorated kernel with _DEFAULT_CONFIG (lines 5-11, 207-223).
  get_last_config reads best_config (lines 228-238). Audit only.
implementation_freedoms_observed: >
  Tile sizes, warps, pipeline depth; raster order; ordering of the flattened
  reduction axis (affects only summation order); load mechanism (pointer
  gathers vs descriptors / shared-memory staging); mask and clamp expression.
algorithm_constraints_observed: >
  One kernel with no materialised im2col or padded input copy; cross-
  correlation with implicit zero padding, grouped via a grid axis, same
  stride/padding on both spatial axes; fp32 accumulation over the full
  (channel x kh x kw) reduction, result cast to the input dtype; tensor-core
  dot with TF32 operand precision for fp32 inputs (verify atol 1e-1 / rtol
  1e-2, atol 2e-1 on CDNA3); output (batch, out_channels, out_H, out_W)
  contiguous.
fq_boundary:
  bytes_expr: >
    batch * in_channels * H * H * dtype_size
    + out_channels * (in_channels // groups) * kernel_size ** 2 * dtype_size
    + batch * out_channels * ((H + 2 * padding - kernel_size) // stride + 1) ** 2 * dtype_size
  flops_expr: >
    2 * batch * out_channels
    * ((H + 2 * padding - kernel_size) // stride + 1) ** 2
    * (in_channels // groups) * kernel_size ** 2
  consistent_with_timed_boundary: true
  notes: >
    The formula counts one read of input (assuming W = H as the generator
    guarantees) and weight, one write of output, and 2 flops per
    multiply-accumulate. run() performs only host metadata, an uninitialised
    output allocation and one kernel launch, so the timed boundary is exactly
    the modelled work and nothing is prepacked outside run(). The kernel's
    (kH*kW)-fold redundant gathering of overlapping windows and padded-tile
    MMAs are not counted (compulsory-traffic convention).
notes_for_review:
  - The block_size keyword is accepted but unused.
  - All sweep cases use groups=1 and batch=1, so the grouped path and batch arithmetic are unexercised.
  - The CDNA3 verify override lives in config.yaml, not in the kernel; it changes tolerance only.
  - The autotune key does not include out_H / out_W, which are derived from keyed parameters.
