functional_semantics: >
  Grouped 3-D cross-correlation without bias, as computed by
  torch.nn.functional.conv3d(input, weight, bias=None, stride, padding, groups)
  (impl_torch.py lines 7-14), the same scalar stride and padding on all three
  spatial axes. With Cin_g = in_channels // groups, Cout_g = out_channels //
  groups and g = oc // Cout_g:
  out[b, oc, od, oh, ow] = sum_{ic_local, kd, kh, kw}
  input[b, g*Cin_g + ic_local, od*stride + kd - padding, oh*stride + kh - padding,
  ow*stride + kw - padding] * weight[oc, ic_local, kd, kh, kw], out-of-range
  input positions contribute zero; out_D = (D + 2*padding - kD) // stride + 1 and
  likewise out_H, out_W. No kernel flip; no reference preprocessing or precision
  flags. The generator (tensors.py 350-363) uses W = H, torch.randn input
  (batch, in_channels, D, H, W) and weight (out_channels, in_channels // groups,
  kernel_size, kernel_size, kernel_size), and passes stride, padding, groups
  positionally.
run_signature:
  text: |
    def run(
        input: torch.Tensor,
        weight: torch.Tensor,
        stride: int = 1,
        padding: int = 1,
        groups: int = 1,
        block_size: int = 1024,
        autotune: bool = False,
        **kwargs,
    ):
  positional_inputs: [input, weight, stride, padding, groups]
  keyword_params: [block_size, autotune, kwargs]
  returns: single tensor output of shape (batch, out_channels, out_D, out_H, out_W), dtype of input
  get_last_config: present
