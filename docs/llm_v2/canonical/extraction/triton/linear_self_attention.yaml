  - description: PhiK_t = PhiK.t().contiguous() -- transpose copy of phi(K) to (D, M) row-major so the kv GEMM can TMA-load K-major tiles
    lines: [223, 223]
    kind: transpose
    inside_run: true
    cached_across_calls: false
    notes: a torch copy kernel executed on the timed path every call; not cached.
  - description: V_t = V.t().contiguous() -- transpose copy of the input V to (D, M) row-major
    lines: [224, 224]
    kind: transpose
    inside_run: true
    cached_across_calls: false
    notes: input-layout transform performed inside run() every call (timed); no cache, so it is paid even though V does not change between repeats.
  - description: TensorDescriptor.from_tensor for PhiK_t, V_t, S (dummy [1,1] block shape in the autotune path, config block shapes in the default path)
    lines: [227, 230]
    kind: metadata
    inside_run: true
    cached_across_calls: false
    notes: default path equivalent at lines 250-255; the autotune pre_hooks (lines 46-52) set block_shape per config.
  - description: S_t = S.t().contiguous() -- transpose copy of the (D, D) state so the out GEMM can TMA-load K-major tiles
    lines: [239, 239]
    kind: transpose
    inside_run: true
    cached_across_calls: false
    notes: default path at line 269; small (D x D) but a separate copy kernel on the timed path.
  - description: TensorDescriptor.from_tensor for PhiQ, S_t, O
    lines: [240, 242]
    kind: metadata
    inside_run: true
    cached_across_calls: false
    notes: default path at lines 270-275.
