functional_semantics: >
  Non-causal, single-head linear attention with the elu+1 feature map.
  Reference impl_torch (lines 4-30): phi(x) = where(x > 0, x + 1, exp(x))
  applied element-wise to Q and K (M, D) fp32; S = phi(K)^T @ V (D, D);
  Z = phi(K).sum(dim=0) (D,); out = (phi(Q) @ S) / ((phi(Q) @ Z)[:, None]
  + eps) (M, D). The reference calls .contiguous() on Q, K, V and sets
  torch.backends.cuda.matmul.allow_tf32 = True around its matmuls
  (restored in finally), so S, phi(Q)@S and the phi(Q)@Z matvec all run
  as TF32 on the reference side. Generator (tensors.py 500-518): Q, K, V =
  uniform(-3, 3) fp32 (M, D), contiguous; any non-fp32 dtype raises; eps
  (case_defaults 1e-6) is returned as the fourth positional argument.
run_signature:
  text: |-
    def run(
        Q: torch.Tensor,
        K: torch.Tensor,
        V: torch.Tensor,
        eps: float = 1e-6,
        block_size: int = None,
        autotune: bool = False,
        **kwargs,
    ):
  positional_inputs: [Q, K, V, eps]
  keyword_params: [block_size, autotune, "**kwargs"]
  returns: single fp32 tensor O of shape (M, D)
  get_last_config: present (keys prefixed kv_ and out_, lines 289-309)
inputs:
  - name: Q
    shape: "(M, D)"
    dtype: fp32 (asserted, line 204)
    layout: contiguous (run() calls .contiguous(), line 206; no-op for generator inputs)
    mutated_in_place: false
    notes: CUDA asserted (line 202); consumed by phi_kernel only (line 219).
  - name: K
    shape: "(M, D)"
    dtype: fp32
    layout: contiguous (line 207)
    mutated_in_place: false
    notes: consumed by phi_kernel only (line 220).
  - name: V
    shape: "(M, D)"
    dtype: fp32
    layout: contiguous (line 208)
    mutated_in_place: false
    notes: consumed only through the transposed copy V_t = V.t().contiguous() (line 224) made inside run() on every call.
  - name: eps
    shape: scalar python float
    dtype: float
    layout: n/a
    mutated_in_place: false
    notes: passed as float(eps) to out_gemm_kernel where it is a tl.constexpr (line 119).
outputs:
  - name: O
    shape: "(M, D)"
    dtype: fp32
    allocated_by: run
    aliasing: none
