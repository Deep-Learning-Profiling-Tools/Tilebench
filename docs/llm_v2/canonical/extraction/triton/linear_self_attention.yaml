    kind: kernel
    lines: [55, 77]
    launches: "1 launch, grid ceil(D / BLOCK_M) x ceil(D / BLOCK_N)"
    depends_on: [s4, s5]
    fusable_with: [s7]
    produces: S (D, D) fp32
  - id: s7
    description: >
      z_kernel: Z[d] = sum_m PhiK[m, d]. 1-D grid over D in BLOCK_D chunks;
      each program loops over M in BLOCK_M row chunks, masked load of a
      [BLOCK_M, BLOCK_D] block of PhiK (other=0.0), acc += tl.sum(block,
      axis=0) (lines 94-102); masked store of Z (line 104). Launch
      parameters fixed in _launch_z (lines 182-190), not tuned; reads PhiK
      a second time (independently of s4).
    kind: kernel
    lines: [80, 104]
    launches: "1 launch, grid ceil(D / BLOCK_D)"
    depends_on: [s3]
    fusable_with: [s3, s6]
    produces: Z (D,) fp32
  - id: s8
    description: S_t = S.t().contiguous() (torch transpose copy, (D, D)).
    kind: memcpy
    lines: [239, 239]
    launches: "1 torch copy kernel (expected); default path line 269"
    depends_on: [s6]
    fusable_with: [s6]
    produces: S_t (D, D) fp32
  - id: s9
    description: >
      out_gemm_kernel: for an (M, D) output tile, numer = PhiQ_tile @ S via
      K-loop tl.range(cdiv(D, BLOCK_K)) with TMA loads q [BLOCK_M,
      BLOCK_K] from PhiQ and st [BLOCK_N, BLOCK_K] from S_t, numer =
      tl.dot(q, st.T, numer, input_precision='tf32') (lines 133-136); in
      the same loop denom[m] += sum_k q[m, k] * Z[k] with Z loaded masked
      (other=0.0) and a plain fp32 multiply + tl.sum(axis=1) (lines
      138-140); out = numer / (denom[:, None] + eps) (line 142); TMA store
      to O (line 143). The denominator is recomputed by every N-tile
      program of the same M rows.
    kind: kernel
    lines: [116, 143]
    launches: "1 launch, grid ceil(M / BLOCK_M) x ceil(D / BLOCK_N)"
    depends_on: [s2, s7, s8]
    fusable_with: [s2]
    produces: O (M, D) fp32 (returned)
algorithm_family: >
  Linear attention (feature map phi = elu + 1, non-causal, single head)
  realised as an unfused pipeline: two element-wise feature-map kernels, a
  state GEMM S = phi(K)^T V and an output GEMM phi(Q) S, both TMA-fed
  tensor-core GEMMs with TF32 operands over host-pre-transposed K-major
  copies, plus a separate column-sum kernel for the normaliser Z and a
  fused per-row denominator phi(Q).Z inside the output GEMM; eight device
  launches per call (five Triton kernels + three torch transpose copies).
reduction_scan_sort_structure: >
  S: reduction over M inside tl.dot, sequential over BLOCK_K-sized chunks
  in the tl.range loop, fp32 accumulator, TF32 MMA. Z: sequential over M in
  BLOCK_M chunks, tl.sum over the chunk's rows then vector add, fp32. numer:
  reduction over D in BLOCK_K chunks, TF32 MMA, fp32 accumulator. denom:
  per chunk tl.sum(axis=1) of q*z in fp32 FMA (not tensor core), then
  sequential accumulation. eps is added to the denominator after the full
  reduction, matching the reference.
precision:
  input_dtypes: [fp32]
  accumulation: fp32 for all four reductions
  output_dtype: fp32
  special_modes: "input_precision='tf32' on both tl.dot calls (lines 75, 136): MMA operands are rounded to TF32, matching the reference's allow_tf32=True. Asymmetry: the Triton denominator phi(Q).Z is exact fp32 FMA, whereas the reference evaluates phi_q @ Z as a TF32 matmul; the Triton phi uses tl.exp."
  masking_or_padding_values: "z_kernel: other=0.0 on PhiK loads and masked Z store; out_gemm: Z loaded with other=0.0; TMA descriptor loads zero-fill out-of-bounds rows/cols and TMA stores clip (relevant for M = 10000 which is not a tile multiple); phi_kernel masked by offs < M*D"
intermediate_storage: >
  Per call, all fp32, all allocated inside run() and released by refcount
  after return: PhiQ (M, D), PhiK (M, D), PhiK_t (D, M), V_t (D, M), S
  (D, D), S_t (D, D), Z (D,). Nothing persists across calls.
mutation_rules: >
  Q, K, V are never written (contiguous() is a no-op for the generator's
  inputs); every call allocates fresh buffers; idempotent.
hardware_dispatch_branches: []
