    produces: PhiK_t (D, M) fp32
  - id: s5
    description: V_t = V.t().contiguous() (torch transpose copy to (D, M)).
    kind: memcpy
    lines: [224, 224]
    launches: "1 torch copy kernel (expected)"
    depends_on: [s1]
    fusable_with: "none"
    produces: V_t (D, M) fp32
  - id: s6
    description: >
      kv_gemm_kernel: S[d1, d2] = sum_m PhiK_t[d1, m] * V_t[d2, m]. 2-D grid
      over (D/BLOCK_M, D/BLOCK_N) output tiles; fp32 accumulator; K-loop
      tl.range(cdiv(M, BLOCK_K)) (line 70) TMA-loads kt [BLOCK_M, BLOCK_K]
      from PhiK_t and vt [BLOCK_N, BLOCK_K] from V_t and does acc =
      tl.dot(kt, vt.T, acc, input_precision='tf32') (lines 73-75); TMA
      store of the S tile cast to S's dtype (fp32) (line 77). OOB rows for
