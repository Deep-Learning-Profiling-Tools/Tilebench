    default_present: true
autotune_mechanism: >
  Two independent triton.autotune wrappers (lines 146-179) over the shared
  _TILE_SHAPES list x num_warps x num_stages, keyed on ["M", "D"], each
  with a pre_hook (lines 46-52, 107-113) that rewrites the three
  TensorDescriptors' block_shape to the candidate config (descriptors are
  created with a dummy [1, 1] block shape in the autotune path, lines
  227-230 and 240-242). Default path builds descriptors with
  _DEFAULT_KV_CONFIG / _DEFAULT_OUT_CONFIG block shapes (lines 250-284).
  phi_kernel and z_kernel are launched with fixed parameters in both
  paths. get_last_config merges both best_configs with kv_/out_ prefixes.
implementation_freedoms_observed: >
  Tile shapes, warps, stages and pipelining of the two GEMMs; TMA
  descriptors versus pointer loads; whether operands are materialised as
  transposed copies (as here) or read with transposed strides / tl.trans;
  fusing phi into the GEMM operand loads; computing Z inside the kv GEMM
  (as phi(K)^T 1) or inside the phi kernel instead of a separate pass;
  computing the denominator once per row block instead of per N tile;
  launch count and ordering; whether to pre-transpose V outside the timed
  region (not done here).
algorithm_constraints_observed: >
  Keep: phi(x) = x + 1 for x > 0, exp(x) otherwise, applied to Q and K;
  state S = phi(K)^T V of shape (D, D) accumulated in fp32 with TF32 (or
  better) operand precision; Z = column sums of phi(K); O = phi(Q) S /
  (phi(Q) . Z + eps) with eps added after the reduction; fp32 (M, D)
  output; fp32 inputs; non-causal, single head, no 1/sqrt(D) scaling;
  inputs read-only.
fq_boundary:
  bytes_expr: "(4 * M * D + D * D + D) * dtype_size"
  flops_expr: "4 * M * D * D + 3 * M * D"
  consistent_with_timed_boundary: true
  notes: >
    Everything the formula counts happens inside run(); nothing is cached
    or prepacked across calls and no input is assumed pre-transposed, so
    the formula credits no untimed work. It is however the minimal-traffic
    model (read Q, K, V once, write O once, plus S and Z once); the timed
    region actually performs about 11 M*D-sized passes (PhiQ/PhiK
    write+read, PhiK_t and V_t write+read, PhiK re-read by z_kernel, S and
    S_t round trips) and three torch transpose copies, roughly 2.5-3x the
    counted bytes. flops counts the two GEMMs (4*M*D*D) plus three M*D
    element-wise/matvec passes, which approximates the two phi maps and the
    denominator; the Z sum and per-N-tile denominator recomputation are
    extra uncounted work. dtype_size is 4 (fp32 only).
notes_for_review:
  - V_t = V.t().contiguous() is an input-layout transform executed inside run() on every call (timed, uncached) purely to feed the TMA descriptor; a cached or host-side prepack would move it out of the timed region, so the F/Q boundary here is 'transpose included'.
  - PhiK_t and S_t transposes are likewise per-call torch copy kernels on the timed path; total launches per call = 8 (5 Triton + 3 torch copies).
  - bytes_expr counts only the ideal 4*M*D + D*D + D traffic; actual traffic in the timed region is roughly 3x larger.
  - z_kernel has a fixed, untuned configuration and a grid of only ceil(D / BLOCK_D) programs (very low parallelism for small D); it re-reads PhiK from memory instead of being fused into the kv GEMM or phi pass.
  - The denominator phi(Q).Z is recomputed by every N-tile program (redundant by a factor ceil(D / out_BLOCK_N)) and in exact fp32 FMA, while the reference computes it as a TF32 matvec.
  - TMA/TensorDescriptor path requires a TMA-capable GPU; no fallback branch exists in the source.
  - The M = 10000 cases are not tile multiples; correctness relies on TMA zero-fill of out-of-bounds operand rows and store clipping (z_kernel uses explicit masks).
  - The reference toggles the process-wide torch.backends.cuda.matmul.allow_tf32 flag (restored in finally).
  - block_size kwarg is accepted but ignored; eps becomes a tl.constexpr so a different eps recompiles out_gemm_kernel.
  - get_last_config keys (kv_*, out_*) match _DEFAULT_KV_CONFIG / _DEFAULT_OUT_CONFIG names, as required for NCU replay.
