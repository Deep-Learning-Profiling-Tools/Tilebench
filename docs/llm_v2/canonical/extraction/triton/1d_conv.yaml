    shape: "(batch, in_channels, L)"
    dtype: case dtype (fp16 or fp32 in the sweep)
    layout: contiguous row-major (asserted at line 145; strides passed explicitly to the kernel, lines 169-171)
    mutated_in_place: false
    notes: read in place by the kernel via computed pointers; no im2col copy
  - name: weight
    shape: "(out_channels, in_channels // groups, kernel_size)"
    dtype: same as input
    layout: contiguous (asserted at line 145; strides passed at lines 172-174)
