functional_semantics: >
  Grouped 1-D cross-correlation without bias, as computed by
  torch.nn.functional.conv1d(input, weight, bias=None, stride, padding, groups)
  (impl_torch.py lines 7-14). With Cin_g = in_channels // groups and
  Cout_g = out_channels // groups, for group g = oc // Cout_g:
  out[b, oc, ol] = sum_{ic_local < Cin_g} sum_{kl < kL}
  input[b, g*Cin_g + ic_local, ol*stride + kl - padding] * weight[oc, ic_local, kl],
  where input positions outside [0, L) contribute zero (implicit zero padding),
  and out_L = (L + 2*padding - kL) // stride + 1. No kernel flip. The reference
  performs no preprocessing and sets no precision flags; the generator
  (tensors.py 366-377) produces input (batch, in_channels, L) and weight
  (out_channels, in_channels // groups, kernel_size) with torch.randn and
  passes stride, padding, groups as positional scalars.
run_signature:
  text: |
    def run(
        input: torch.Tensor,
        weight: torch.Tensor,
        stride: int = 1,
        padding: int = 1,
        groups: int = 1,
        block_size: int = 1024,
        autotune: bool = False,
        **kwargs,
    ):
  positional_inputs: [input, weight, stride, padding, groups]
  keyword_params: [block_size, autotune, kwargs]
  returns: single tensor output of shape (batch, out_channels, out_L), dtype of input
  get_last_config: present
inputs:
