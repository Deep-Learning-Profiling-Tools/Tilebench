functional_semantics: >
  Training-mode batch normalisation of a 2-D (N, C) matrix over the batch axis
  with a per-channel affine transform. The reference (impl_torch.py lines
  9-14) calls torch.nn.functional.batch_norm(input, running_mean=None,
  running_var=None, weight=gamma.float(), bias=beta.float(), training=True,
  momentum=0.0, eps=eps), i.e. for each channel c: mean_c = (1/N) sum_n
  x[n, c], var_c = (1/N) sum_n (x[n, c] - mean_c)^2 (biased), and
  y[n, c] = (x[n, c] - mean_c) / sqrt(var_c + eps) * gamma_c + beta_c.
  Reference-side preprocessing: gamma and beta are upcast to fp32 (line 12).
  A special case N == 1 returns beta broadcast to the input shape (lines 7-8).
  The generator (tensors.py 97-102) produces torch.randn input (N, C), gamma
  (C,), beta (C,) in the case dtype and passes N, C, eps positionally.
run_signature:
  text: |
    def run(input: torch.Tensor, gamma: torch.Tensor, beta: torch.Tensor,
            N: int, C: int, eps: float,
            block_size: int = 1024, autotune: bool = False, **kwargs):
  positional_inputs: [input, gamma, beta, N, C, eps]
  keyword_params: [block_size, autotune, kwargs]
  returns: single tensor output of shape (N, C), dtype of input
  get_last_config: present
inputs:
  - name: input
    shape: "(N, C)"
    dtype: case dtype (fp16, bf16 or fp32)
    layout: contiguous row-major; the kernels index rows * C + cols (lines 34, 103), so a row stride of C is assumed
    mutated_in_place: false
    notes: read twice (statistics pass and apply pass)
  - name: gamma
    shape: "(C,)"
    dtype: input dtype
    layout: contiguous
    mutated_in_place: false
    notes: upcast to fp32 inside the apply kernel (line 94)
  - name: beta
    shape: "(C,)"
    dtype: input dtype
    layout: contiguous
    mutated_in_place: false
    notes: upcast to fp32 inside the apply kernel (line 95)
  - name: N
    shape: scalar int
    dtype: python int
    layout: n/a
    mutated_in_place: false
    notes: runtime argument to all three kernels
  - name: C
    shape: scalar int
    dtype: python int
    layout: n/a
    mutated_in_place: false
    notes: tl.constexpr in kernels 1 and 3 (lines 18, 83), runtime in kernel 2 (line 50); padded to the next power of two for the column tile (lines 134, 151, 158)
  - name: eps
    shape: scalar float
    dtype: python float
    layout: n/a
    mutated_in_place: false
    notes: runtime argument of kernel 2 (line 53)
outputs:
  - name: output
    shape: "(N, C)"
    dtype: input dtype (torch.empty_like at line 124)
    allocated_by: run
    aliasing: none
