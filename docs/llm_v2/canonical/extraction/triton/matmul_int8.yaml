functional_semantics: >
  Integer GEMM against a 2-bit-packed weight matrix. Inputs: A int8 (M, K);
  B uint8 (K_b, N) with K_b = K / 4, every byte holding four 2-bit fields.
  Reference impl_torch.run (lines 4-19): for i in 0..3, field i of B[k, n]
  is ((B[k, n] & (3 << 2i)) >> 2i) - 1, an int8 value in {-1, 0, 1, 2},
  placed at logical row i*K_b + k of an unpacked int8 matrix B_unpacked
  (K, N) (lines 10-14). The result is C = A @ B_unpacked (M, N) as int32;
  the reference evaluates it as an fp32 torch.matmul with
  torch.backends.cuda.matmul.allow_tf32 = False (set process-wide inside
  run(), line 17, never restored) and casts to int32, which is exact for
  the generated ranges (|A| <= 64, |b| <= 2, K <= 20480 gives |C| <
  2^24). Generator (tensors.py 439-448): a = randint(-64, 65) int8 (M, K),
  b = randint(0, 256) uint8 (K_b, N); the config's dtype 'int8' is ignored
  by the generator; asserts K % 4 == 0. Config: M = N = 2048, K = 1024*i.
run_signature:
  text: |-
    def run(a: torch.Tensor, b: torch.Tensor, block_size: int = None,
            autotune: bool = False) -> torch.Tensor:
  positional_inputs: [a, b]
  keyword_params: [block_size, autotune]
  returns: single int32 tensor c of shape (M, N)
  get_last_config: present
inputs:
  - name: a
    shape: "(M, K)"
    dtype: int8
    layout: row-major contiguous (asserted, line 123); host TensorDescriptor built directly on it (line 112)
    mutated_in_place: false
    notes: TMA-loaded as [BLOCK_M, BLOCK_K] tiles at column offset i*K_b + j*BLOCK_K (lines 73-74), i.e. four disjoint K-slices per packed-B tile.
  - name: b
    shape: "(K_b, N) with K_b = K / 4 (asserted a.shape[1] == 4 * b.shape[0], line 120)"
    dtype: uint8 (four 2-bit fields per byte)
    layout: row-major as supplied; NEVER read by the kernel directly -- consumed only through bt = b.t().contiguous() of shape (N, K_b) (lines 19-24, 128)
    mutated_in_place: false
    notes: the (N, K_b) copy is cached across calls, keyed weakly by the tensor object.
outputs:
  - name: c
    shape: "(M, N)"
    dtype: int32 (torch.empty(..., dtype=torch.int32), line 127; int32 accumulator stored without cast, line 79)
    allocated_by: run
    aliasing: none
preprocessing:
  - description: >
      bt = _b_transposed(b): b.t().contiguous() -> (N, K_b) uint8, so the
      packed B is K-major and TMA-loadable as [BLOCK_N, BLOCK_K] tiles.
      Cached in a module-level torch.utils.weak.WeakTensorKeyDictionary
      keyed by the tensor object b.
    lines: [16, 24]
    kind: transpose
    inside_run: true
    cached_across_calls: true
    notes: >
      Called at line 128 on every run(), but the transpose copy (read +
      write of K*N/4 bytes, one torch copy launch) executes only on the
      first call per live B tensor -- i.e. during warmup -- and all later
      (timed) calls hit the cache. The weak key means the entry dies with
      b, so there is no stale-address hazard and no unbounded retention,
      unlike matmul_fp32_fp16_fp8's dict.
  - description: shape/contiguity asserts; c = torch.empty((M, N), dtype=torch.int32)
    lines: [120, 127]
    kind: allocation
    inside_run: true
    cached_across_calls: false
    notes: fresh output per call.
  - description: >
      Host-side TMA descriptors via _descriptors(a, bt, c, bm, bn, bk)
      (lines 111-115): dummy [1, 1] shapes in the autotune path (line 132)
      rewritten by the pre_hook _tma_set_block_size_hook (lines 27-33) per
      candidate and before the final launch; concrete shapes in the default
      path (line 141).
    lines: [132, 141]
    kind: metadata
    inside_run: true
    cached_across_calls: false
    notes: cheap host metadata; rebuilt every call.
stages:
  - id: s1
    description: bt cache lookup (transpose only on first sight of b), output allocation, descriptor construction
    kind: host
    lines: [120, 142]
    launches: "0 in steady state (1 torch transpose-copy launch on the first call per distinct b)"
    depends_on: []
    fusable_with: "none"
    produces: bt (N, K_b) cached; c (M, N) int32; a_desc, b_desc, c_desc
  - id: s2
    description: >
      matmul_kernel: static_assert K % (4 * BLOCK_K) == 0 (lines 46-49);
      1-D grid with grouped tile ordering (lines 50-62); int32 accumulator
      (line 63); K_b = K // 4 as a constexpr (line 65). Outer loop j over
      cdiv(K_b, BLOCK_K) packed tiles (line 68): one TMA load of b_uint8
      [BLOCK_N, BLOCK_K] from bt (line 71); inner static loop i = 0..3
      (line 72): TMA load of a [BLOCK_M, BLOCK_K] at column i*K_b +
      j*BLOCK_K (lines 73-74), decode field i as ((b_uint8 & (3 << 2i)) >>
      2i).to(int8) - 1 (lines 75-76), accumulator = tl.dot(a, b.T,
      accumulator, out_dtype=int32) (line 77). Epilogue: TMA store of the
      int32 tile (line 79). Each packed-B tile is loaded once and reused
      for four int8 MMAs.
    kind: kernel
    lines: [36, 79]
    launches: "1 launch, grid ceil(M / BLOCK_M) * ceil(N / BLOCK_N)"
    depends_on: [s1]
    fusable_with: "none"
    produces: c (M, N) int32 (returned) -- no intermediates
algorithm_family: >
  Single-kernel blocked int8 GEMM with in-register 2-bit weight unpacking:
  TMA-fed NT layout (A row-major, packed B pre-transposed to K-major and
  cached), each packed tile decoded into four int8 operand tiles that
  multiply four disjoint K-slices of A (logical K index i*K_b + k), int32
  accumulation, grouped 1-D tile ordering; no split-K, no persistence.
reduction_scan_sort_structure: >
  Reduction over the logical K inside tl.dot per [BLOCK_K] chunk,
  accumulated in int32 across the j (packed tile) x i (field) loop nest;
  the visiting order of logical k is therefore not monotone (slices
  i*K_b + [j*BLOCK_K, ...) interleaved over i), which is irrelevant
  because integer accumulation is exact. The reference reduces in fp32
  via cuBLAS (also exact for the generated ranges); verify atol/rtol 0.1
  is effectively exact for integer outputs.
precision:
  input_dtypes: [int8 (A), uint8 packed 2-bit (B)]
  accumulation: int32 (tl.dot out_dtype=tl.int32, line 77)
  output_dtype: int32
  special_modes: "exact integer arithmetic; B fields decoded to int8 in {-1, 0, 1, 2}; int8 x int8 MMA; K is a tl.constexpr (line 40) so the kernel is specialised per K; legality: K % (4 * BLOCK_K) == 0 enforced by static_assert"
  masking_or_padding_values: "no explicit masks; out-of-bounds handled by TMA descriptors (zero-filled loads, clipped stores); the config sweep (M = N = 2048, K multiples of 1024) is tile-aligned and satisfies the divisibility constraint for every search-space BLOCK_K"
intermediate_storage: >
  bt (N, K_b) uint8 per live B tensor, held in a weak-keyed module cache
  (lifetime = B's lifetime). No other scratch; c is the returned output.
mutation_rules: >
  a and b are never written; c is fresh per call; idempotent. Safe against
  storage reuse because the cache key is the tensor object, not its
  address.
hardware_dispatch_branches: []
