    default_present: true
  - name: BLOCK_SIZE_N
    role: tile size
    default_present: true
  - name: BLOCK_SIZE_K
    role: tile size (packed K_b chunk; logical K chunk is 4x)
    default_present: true
  - name: GROUP_SIZE_M
    role: tile ordering / L2 swizzle group
