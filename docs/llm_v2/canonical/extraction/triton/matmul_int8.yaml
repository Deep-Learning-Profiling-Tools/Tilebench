autotune_mechanism: >
  triton.autotune (lines 82-108) over BLOCK_M x BLOCK_N x BLOCK_K x
  num_warps x num_stages with two filters (a tile-area cap and a
  shared-memory budget estimate, lines 100-103), keyed on ["M", "N", "K"],
  warmup=1, rep=3, with pre_hook _tma_set_block_size_hook rewriting the
  descriptors' block_shape per candidate. Default path uses
  _DEFAULT_CONFIG (lines 6-13, 138-152). get_last_config reads best_config
  (lines 156-167).
implementation_freedoms_observed: >
  Tile sizes, warps, stages, grouped ordering, pipelining; TMA descriptors
  versus pointer loads; whether packed B is consumed K-major through a
  cached transpose (as here) or read in its native (K_b, N) layout; decode
  strategy (shift/mask in registers vs lookup) and loop nesting (fields
  inner vs outer); split-K or persistent scheduling; whether K is a
  constexpr.
algorithm_constraints_observed: >
  Keep: packed-B decoding semantics (field i at bits 2i..2i+1, value =
  field - 1, logical K index i*K_b + k); int8 x int8 products accumulated
  exactly in int32; int32 (M, N) output; A read once per N-tile column and
  each packed-B byte read once per M-tile row (the 4x operand reuse is the
  point of the packing); inputs read-only; K % 4 == 0 (and in this source
  K % (4 * BLOCK_K) == 0). Whether the K-major repack of B belongs to the
  timed algorithm is the open boundary question: here it runs once and is
  cached, so the steady-state timed region is the GEMM alone.
fq_boundary:
  bytes_expr: "M * K + K * N // 4 + 4 * M * N"
  flops_expr: "2 * M * N * K"
  consistent_with_timed_boundary: true
  notes: >
    The formula uses explicit byte counts (not dtype_size): A once as int8
    (M*K bytes), the packed B once (K*N/4 bytes) and C once as int32
    (4*M*N bytes). In the steady-state timed region that is exactly the
    kernel's compulsory traffic, but only because the transposition of the
    packed B into bt is cached across calls (executed once at warmup, never
    timed); the formula thus assumes a prepacked K-major packed B. A
    re-implementation that transposes per call would carry an extra
    2*K*N/4 bytes of uncounted, timed traffic; one reading B in its native
    layout would match the formula without a cache. The formula correctly
    assumes B arrives packed (the generator produces it packed; the
    reference's unpacking to a full int8 (K, N) matrix and fp32 conversion
    happens on the reference side only). flops_expr counts the logical
    unpacked GEMM, which is what the kernel executes (four MMAs per packed
    tile).
notes_for_review:
  - The K-major prepack of packed B is cached in a WeakTensorKeyDictionary: no stale-pointer hazard, but it still moves the transpose out of the steady-state timed region (same F/Q boundary as matmul_fp32_fp16_fp8).
  - impl_torch sets torch.backends.cuda.matmul.allow_tf32 = False inside run() and never restores it (process-wide side effect on other operators' fp32 references, notably matmul_fp32_fp16_fp8 which sets it True at import).
  - Reference unpack layout (row i*K_b + k) and the kernel's k_pos = i*K_b + j*BLOCK_K agree, so both sides use the same logical K ordering.
  - K is a tl.constexpr with static_assert K % (4 * BLOCK_K) == 0: one compile per sweep point and arbitrary K is unsupported; the config's K = 1024*i satisfies it for every search-space BLOCK_K.
  - Decoded field values span {-1, 0, 1, 2} (the generator comment says 'ternary-ish'); not a symmetric ternary code.
  - The case dtype 'int8' in config.yaml is a label only; the generator ignores it and bytes_expr does not use dtype_size.
  - TMA descriptors require 16-byte-aligned strides and a TMA-capable GPU; no fallback branch exists.
  - run() has no **kwargs; the engine must pass only block_size/autotune.
