functional_semantics: >
  Block-sparse causal attention with grouped-query heads. For batch b, query
  head h and query position m, with kv head h_kv = h // (num_heads //
  num_kv_heads) and layout head lh = h % num_layout:
  out[b, h, m, :] = sum_{n in A} softmax_n(scale * q[b,h,m,:] . k[b,h_kv,n,:]) v[b,h_kv,n,:],
  where the admissible key set A = { n < total_seq_len : n <= m and the block
  (m // BLOCK_M, n // BLOCK_N) is listed in the CSR layout of lh }. The
  reference (impl_torch.py) builds a flex_attention BlockMask from the CSR
  layout ANDed with q_idx >= kv_idx (lines 16-42, cached per col-index tensor
  at lines 13, 52-58) and calls a torch.compile'd flex_attention with
  scale=softmax_scale and enable_gqa=True (lines 11, 60-61). The generator
  (tensors.py 265-326) produces torch.randn Q (B, H, M, D), K and V
  (B, H_kv, M, D), a single shared layout (num_layout = 1) that for row block
  r lists the key blocks max(0, r - 2) .. r (causal local window, lines
  294-311), int32 CSR row pointers and zero-padded column indices (lines
  314-317), softmax_scale = 1/sqrt(D), and EVEN_M/EVEN_N flags.
run_signature:
  text: |
    def run(Q, K, V, layout_csr_row_indices, layout_csr_col_indices,
            layout_csr_row_stride_h, layout_csr_col_stride_h,
            num_layout, softmax_scale, num_heads, num_kv_heads,
            total_seq_len, BLOCK_M, EVEN_M, BLOCK_N, EVEN_N, BLOCK_D, NUM_D_BLOCKS,
            block_size: int = None, autotune: bool = False):
  positional_inputs: [Q, K, V, layout_csr_row_indices, layout_csr_col_indices, layout_csr_row_stride_h, layout_csr_col_stride_h, num_layout, softmax_scale, num_heads, num_kv_heads, total_seq_len, BLOCK_M, EVEN_M, BLOCK_N, EVEN_N, BLOCK_D, NUM_D_BLOCKS]
  keyword_params: [block_size, autotune]
  returns: single tensor out of shape (B, num_heads, total_seq_len, D), dtype of Q
  get_last_config: present
