operator: quantize_global
source: triton
source_sha: ea04fb368c88ed4ee8621e3b1b1d6013a96f1cfe
files:
  - path: tilebench/benchmarks/operators/quantize_global/impl_triton.py
    functions:
      - name: quantize_kernel
        lines: [8, 14]
        role: kernel
      - name: _quantize_kernel_autotuned
        lines: [17, 28]
        role: tuner
      - name: run
        lines: [31, 46]
        role: host-driver
      - name: get_last_config
        lines: [49, 53]
        role: helper
  - path: tilebench/benchmarks/operators/quantize_global/impl_torch.py
    functions:
      - name: run
        lines: [4, 5]
        role: host-driver
  - path: tilebench/benchmarks/operators/quantize_global/config.yaml
    functions: []
