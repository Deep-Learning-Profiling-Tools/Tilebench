functional_semantics: >
  2-D max pooling over a flat NCHW tensor. The reference (impl_torch.py lines
  5-8) views the flat input as (N, C, H, W), applies
  torch.nn.functional.max_pool2d(x, kernel_size, stride=stride, padding=padding)
  and returns the result flattened to 1-D. Semantically
  out[n, c, oh, ow] = max_{kh < k, kw < k} x[n, c, oh*stride + kh - padding,
  ow*stride + kw - padding] with out-of-range positions treated as -inf,
  H_out = (H + 2*padding - k) // stride + 1 and likewise W_out. The generator
  (tensors.py 481-489) produces a flat torch.randn tensor of N*C*H*W elements
  with W = H and passes N, C, H, W, kernel_size, stride, padding positionally.
run_signature:
  text: |
    def run(input, N, C, H, W, kernel_size, stride, padding,
            block_size: int = 1024, autotune: bool = False, **kwargs):
  positional_inputs: [input, N, C, H, W, kernel_size, stride, padding]
  keyword_params: [block_size, autotune, kwargs]
  returns: single 1-D tensor of N*C*H_out*W_out elements (NCHW order), dtype of input
  get_last_config: present
