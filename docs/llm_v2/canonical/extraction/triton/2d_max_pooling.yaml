stages:
  - id: s1
    description: >
      Direct stencil max-pooling kernel. Grid axis 0 is the (n, c) plane,
      axes 1 and 2 tile the output rows and columns (lines 22-27). The program
      initialises a running tile to -inf in the input dtype (lines 30-31),
      then for every (kh, kw) tap in two fully unrolled static loops computes
      the input coordinates (lines 35-36), masks positions outside the plane
      (lines 37-38), loads with other=-inf (lines 39-40) and folds with
      tl.maximum (line 41). The tile is stored to the flat output plane with a
      bounds mask (lines 43-46). Launched at lines 73-102.
    kind: kernel
    lines: [8, 46]
    launches: "1 launch; N*C x ceil(H_out / BLOCK_rows) x ceil(W_out / BLOCK_cols) programs"
    depends_on: []
    fusable_with: none
    produces: output
algorithm_family: >
  Direct (stencil) 2-D max pooling: each program owns a 2-D tile of one output
  plane and takes the elementwise maximum over the kernel_size**2 taps with
  unrolled loops, reading the input in place; out-of-plane taps are masked to
  -inf. No unfold/im2col, single kernel.
reduction_scan_sort_structure: >
  Max over kernel_size**2 taps, fixed order kh outer / kw inner (lines 33-34),
  folded elementwise into a running tile with tl.maximum. The order is
  irrelevant for the result except for NaN behaviour.
precision:
  input_dtypes: [fp16, bf16, fp32]
  accumulation: native input dtype, no upcast (tl.full with input_ptr.dtype.element_ty at lines 30-31); max is exact in any dtype
  output_dtype: input dtype
  special_modes: none
  masking_or_padding_values: "-inf for out-of-plane taps (lines 30, 40), which matches max_pool2d's implicit -inf padding"
intermediate_storage: >
  None beyond the output buffer.
mutation_rules: >
  No input is modified; the output is freshly allocated per call; repeated
  calls are idempotent.
hardware_dispatch_branches: []
tunable_parameters:
  - name: BLOCK_R
    role: tile size (output rows per program)
    default_present: true
  - name: BLOCK_C
    role: tile size (output columns per program)
    default_present: true
  - name: num_warps
    role: warps
    default_present: true
autotune_mechanism: >
  triton.autotune (lines 49-59) over a fixed list of (BLOCK_R, BLOCK_C) pairs
  times num_warps, keyed on H_out, W_out, kernel_size, stride, padding,
  warmup=1, rep=3. The non-autotuned path launches the undecorated kernel with
  _DEFAULT_CONFIG (lines 5, 87-102). get_last_config reads best_config (lines
  107-115). Audit only.
implementation_freedoms_observed: >
  Tile shape and warp count; whether the output plane is tiled 1-D or 2-D;
  tap unrolling; load vectorisation; grid-to-plane mapping.
algorithm_constraints_observed: >
  Single kernel reading the flat input in place (no padded copy or unfold);
  -inf padding semantics identical to max_pool2d; max computed in a precision
  that preserves the exact result (native dtype suffices); output is the
  flattened NCHW pooled tensor in the input dtype; kernel_size, stride and
  padding are problem parameters supplied by the generator.
fq_boundary:
  bytes_expr: >
    N * C * H * H * dtype_size
    + N * C * ((H + 2 * padding - kernel_size) // stride + 1) ** 2 * dtype_size
  flops_expr: >
    N * C
    * ((H + 2 * padding - kernel_size) // stride + 1) ** 2
    * kernel_size ** 2
  consistent_with_timed_boundary: true
  notes: >
    The formula counts one read of the input (W = H per the generator) and one
    write of the output, plus one comparison per tap per output element. run()
    only allocates the output and launches the kernel, so the timed boundary
    is exactly the modelled work and nothing is prepacked. The stencil re-reads
    each input element up to ceil(k/stride)**2 times through the cache, which
    the compulsory-traffic formula ignores.
notes_for_review:
  - The block_size keyword is accepted but unused.
  - NaN semantics may differ from max_pool2d (which propagates NaN); tl.maximum behaviour on NaN is not specified here and randn inputs never exercise it.
  - The early return for total_out <= 0 returns a 0-element tensor rather than raising; unreachable in the sweep.
  - flops_expr counts comparisons, not arithmetic flops.
