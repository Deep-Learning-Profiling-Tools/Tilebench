# artifacts/ holds byte-exact publication copies of campaign evidence indexed by sha256
# (docs/llm_v2/ARTIFACT_POLICY.md); hooks must not rewrite them.
exclude: '^artifacts/'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
