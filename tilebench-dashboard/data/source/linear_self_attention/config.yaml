benchmark:
  warmup: 20
  repeat: 100
  use_cuda_graph: true
  flush_l2: true
  autotune: false

case_defaults:
  eps: 1.0e-6

case_grid:
  M: [1024, 2048, 4096, 8192, 10000]
  D: [32, 64, 128, 256]
  dtype: ["fp32"]

verify:
  atol: 5.0e-4
  rtol: 3.0e-3

metrics:
  flops_expr: "4 * M * D * D + 3 * M * D"
  bytes_expr: "(4 * M * D + D * D + D) * dtype_size"
  plots:
    - latency_ms
    - bandwidth_GBs
    - speedup
